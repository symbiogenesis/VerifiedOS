# SPDX-License-Identifier: Apache-2.0
# Native Linux evidence for Sail, Rocq and standalone RTL; tools/ci/README.md
# defines the scope. Ordinary runs restore toolchains and validated proof inputs.
# Monthly and explicitly cold runs install and check everything from scratch.
# The model and proof lanes share no toolchain or output, so each installs only
# its own toolchains and runs on its own runner.

name: guest-gates

on:
  workflow_dispatch:
    inputs:
      cold:
        description: Install toolchains cold and recompile/recheck every proof
        type: boolean
        default: false
  schedule:
    - cron: "23 4 * * 1"
    - cron: "23 4 1 * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PYTHONUNBUFFERED: "1"
  GUEST_COLD: ${{ inputs.cold == true || github.event.schedule == '23 4 1 * *' }}

defaults:
  run:
    # Explicit bash enables pipefail, so tee cannot hide a gate failure.
    shell: bash

jobs:
  changes:
    # Manual dispatch, monthly cold runs and explicit reruns always execute.
    if: ${{ github.event.schedule == '23 4 * * 1' && github.run_attempt == 1 }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      unchanged: ${{ steps.previous.outputs.unchanged }}
    steps:
      - name: Check the previous completed run
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          unchanged=false
          if previous=$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/guest-gates.yml/runs" \
            -f branch="$GITHUB_REF_NAME" -f status=completed -F per_page=1 \
            --jq '.workflow_runs[0] | [.head_sha, .conclusion] | @tsv'); then
            if [[ "$previous" == "$GITHUB_SHA"$'\t'success ]]; then
              unchanged=true
              echo "Scheduled guest gates skipped: revision $GITHUB_SHA already passed." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "::warning::Could not read run history; running all guest gates."
          fi
          echo "unchanged=$unchanged" >> "$GITHUB_OUTPUT"

  guest-gates:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.unchanged != 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    strategy:
      # One lane's failure must not cancel the other lane's verdict.
      fail-fast: false
      matrix:
        include:
          - lane: model
            toolchains: --toolchain sail --toolchain rtl
          - lane: proofs
            toolchains: --toolchain rocq
    env:
      # Installed toolchains and the ownership marker that lets bootstrap resume
      # them; never download caches, build trees, logs or evidence.
      GUEST_TOOLCHAIN_PATHS: |
        ~/verifiedos-guest/.verifiedos-guest-root
        ~/verifiedos-guest/opam
        !~/verifiedos-guest/opam/download-cache
        !~/verifiedos-guest/opam/log
        ~/verifiedos-guest/build/toolchains
      # Only the native receipt, staged sources and compiled objects are reusable.
      # The proof gate validates their bytes and context; a cache hit is no verdict.
      GUEST_PROOF_PATHS: |
        ~/verifiedos-guest/build/proof-gate/proofs/*.v
        ~/verifiedos-guest/build/proof-gate/proofs/*.vo
        ~/verifiedos-guest/build/proof-gate/proofs/proof-evidence.json
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # These gates need indexed pins, not imported-core source trees.
          submodules: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version-file: tools/pyproject.toml
          enable-cache: true
          # Both lanes resolve the same lockfile; one saver avoids a racing upload.
          save-cache: ${{ github.ref == 'refs/heads/main' && matrix.lane == 'model' }}
          cache-dependency-glob: |
            tools/pyproject.toml
            tools/uv.lock

      - name: Cache guest source downloads
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          # The ownership marker lets bootstrap resume this private root.
          # No installed switches, build outputs or verdicts are restored.
          path: |
            ~/verifiedos-guest/.verifiedos-guest-root
            ~/verifiedos-guest/opam/download-cache
            ~/verifiedos-guest/build/verilator-*-source/*.tar.gz
          key: guest-downloads-v1-${{ matrix.lane }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/opam/sail.lock', 'tools/opam/rocq.lock', 'tools/ci/bootstrap_guest.py', 'tools/vos/cli/rtl.py', 'tools/vos/receipts.py') }}
          restore-keys: guest-downloads-v1-${{ matrix.lane }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Identify the runner image
        id: image
        # Installed toolchains link the image's system libraries.
        run: echo "version=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Restore installed toolchains
        id: toolchains
        uses: actions/cache/restore@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: ${{ env.GUEST_TOOLCHAIN_PATHS }}
          # Switch names and the Verilator prefix carry their versions, and bootstrap
          # imports each lock into a restored switch, so env.py and rtl.py stay out.
          # Exact keys only: another snapshot's switch is never restored.
          key: guest-toolchains-v1-${{ matrix.lane }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.version }}-${{ hashFiles('tools/opam/sail.lock', 'tools/opam/rocq.lock', 'tools/ci/bootstrap_guest.py') }}
          # A cold run only learns whether the installation needs saving.
          lookup-only: ${{ env.GUEST_COLD == 'true' }}

      - name: Bootstrap guest toolchains
        id: bootstrap
        timeout-minutes: 120
        run: |
          /usr/bin/time -p python3 tools/ci/bootstrap_guest.py \
            --root "$HOME/verifiedos-guest" --install-system ${{ matrix.toolchains }} \
            --github-env "$GITHUB_ENV" --github-path "$GITHUB_PATH" \
            2>&1 | tee "$RUNNER_TEMP/guest-bootstrap-console.log"

      - name: Save installed toolchains
        # Saved from main once the probes pass, so a later gate failure keeps them.
        if: ${{ github.ref == 'refs/heads/main' && steps.bootstrap.outcome == 'success' && steps.toolchains.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: ${{ env.GUEST_TOOLCHAIN_PATHS }}
          key: ${{ steps.toolchains.outputs.cache-primary-key }}

      - name: Model evidence
        id: evidence
        if: ${{ matrix.lane == 'model' && !cancelled() && steps.bootstrap.outcome == 'success' }}
        timeout-minutes: 180
        # The proofs lane runs the proof gate on its own runner.
        run: |
          /usr/bin/time -p python3 tools/run.py evidence --no-proofs \
            --out "$VOS_LOG_DIR/evidence.json" \
            2>&1 | tee "$VOS_LOG_DIR/evidence-console.log"

      - name: Restore proof cache candidates
        id: proof-cache
        if: ${{ matrix.lane == 'proofs' && !cancelled() && steps.bootstrap.outcome == 'success' }}
        uses: actions/cache/restore@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: ${{ env.GUEST_PROOF_PATHS }}
          key: guest-proofs-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.version }}-${{ hashFiles('tools/opam/rocq.lock', 'tools/ci/bootstrap_guest.py') }}-${{ hashFiles('proofs/*.v', 'tools/**/*.py', 'tools/pyproject.toml', 'tools/uv.lock', 'docs/requirements-register.md', '.github/workflows/guest-gates.yml') }}
          # Older sources are candidates for the gate's dependency-aware validation.
          restore-keys: guest-proofs-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.version }}-${{ hashFiles('tools/opam/rocq.lock', 'tools/ci/bootstrap_guest.py') }}-
          lookup-only: ${{ env.GUEST_COLD == 'true' }}

      - name: Proof gate
        id: proofs
        if: ${{ matrix.lane == 'proofs' && !cancelled() && steps.bootstrap.outcome == 'success' }}
        timeout-minutes: 120
        # Give cold and warm proofs the SAME explicit environment. Actions' per-run
        # IDs and file-command paths must not force an otherwise valid cache miss.
        # The gate still hashes its entire actual environment, tools and libraries.
        run: |
          fresh=()
          if [[ "$GUEST_COLD" == true ]]; then
            fresh=(--fresh)
            echo "Proof policy: fresh compilation, audits and full kernel recheck." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Proof policy: validate native cache candidates; rebuild and recheck anything stale. See proofs.log for actual reuse." >> "$GITHUB_STEP_SUMMARY"
          fi
          /usr/bin/time -p env -i \
            HOME="$HOME" PATH="$PATH" LANG=C.UTF-8 \
            PYTHONUTF8=1 PYTHONUNBUFFERED=1 TMPDIR="$TMPDIR" \
            VOS_BUILD_ROOT="$VOS_BUILD_ROOT" VOS_LANE= \
            VOS_ROCQ="$VOS_ROCQ" VOS_ROCQCHK="$VOS_ROCQCHK" \
            OPAMROOT="$OPAMROOT" UV_CACHE_DIR="$UV_CACHE_DIR" \
            python3 tools/run.py proofs "${fresh[@]}" \
            2>&1 | tee "$VOS_LOG_DIR/proofs.log"

      - name: Save validated proof cache
        # A rebuilt toolchain may differ byte-for-byte from an existing immutable
        # installation cache. Seed cold proof results only with a new toolchain key.
        if: ${{ github.ref == 'refs/heads/main' && !cancelled() && steps.proofs.outcome == 'success' && steps.proof-cache.outputs.cache-hit != 'true' && (env.GUEST_COLD != 'true' || steps.toolchains.outputs.cache-hit != 'true') }}
        uses: actions/cache/save@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: ${{ env.GUEST_PROOF_PATHS }}
          key: ${{ steps.proof-cache.outputs.cache-primary-key }}

      - name: Check generated model bundle
        id: bundle
        if: ${{ matrix.lane == 'model' && !cancelled() && steps.bootstrap.outcome == 'success' }}
        timeout-minutes: 15
        run: |
          /usr/bin/time -p python3 tools/run.py model bundle --check \
            2>&1 | tee "$VOS_LOG_DIR/bundle.log"

      - name: Lint standalone RTL
        id: lint
        if: ${{ matrix.lane == 'model' && !cancelled() && steps.bootstrap.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          /usr/bin/time -p python3 tools/run.py rtl lint \
            2>&1 | tee "$VOS_LOG_DIR/rtl-lint.log"

      - name: Crosscheck RTL against fresh model vectors
        id: crosscheck
        if: ${{ matrix.lane == 'model' && !cancelled() && steps.bootstrap.outcome == 'success' }}
        timeout-minutes: 30
        run: |
          /usr/bin/time -p python3 tools/run.py rtl crosscheck \
            2>&1 | tee "$VOS_LOG_DIR/rtl-crosscheck.log"

      - name: Report guest results
        if: ${{ !cancelled() }}
        env:
          GUEST_LANE: ${{ matrix.lane }}
          # A restored run is not evidence that the toolchains install cold.
          GUEST_TOOLCHAINS: ${{ env.GUEST_COLD != 'true' && steps.toolchains.outputs.cache-hit == 'true' && 'restored' || 'cold' }}
          STEP_RESULTS: ${{ toJSON(steps) }}
        run: python3 tools/ci/report_guest.py

      - name: Preserve guest logs and receipts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: guest-${{ matrix.lane }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ~/verifiedos-guest/logs/
          if-no-files-found: error
          retention-days: 14
