# SPDX-License-Identifier: Apache-2.0
# Native Linux evidence for Sail, Rocq and standalone RTL; tools/ci/README.md
# defines the scope. Ordinary runs restore toolchains, validated proof inputs and
# the model lane's Sail solver memo. Monthly and explicitly cold runs install and
# check everything from scratch.
# Each lane runs on its own runner. The proofs lane shares no toolchain or output
# with the others and installs only its own. The rtl lane selects the model lane's
# toolchains and restores, but never saves, that lane's caches, so the bundle and
# RTL checks run beside the model evidence sweep. Manual dispatch runs from main;
# its optional revision input pins checkout to a commit already on main, verified
# before any checked-out code runs. Its optional reading_base input, verified there
# too, names a proper ancestor of that revision whose proof sources the proofs lane
# compiles, reads and compares with the passing gate's compile. A refused dispatch
# runs no checked-out code afterwards: each later step that runs commands after a
# failure also requires that check not to have failed. A run title follows
# the workflow name with the title input, which fanout fills with the commit subject,
# or else with the checked-out revision.

name: guest-gates
run-name: ${{ format('{0}:{1}', github.workflow, inputs.title || inputs.revision || github.sha) }}

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full commit SHA already on main (empty selects current main)
        type: string
        default: ""
      title:
        description: Optional run title text after the workflow name (empty shows the revision)
        type: string
        default: ""
      cold:
        description: Install toolchains cold and recompile/recheck every proof
        type: boolean
        default: false
      reading_base:
        description: Optional full commit SHA, a proper ancestor of revision, whose proofs the proofs lane reads and compares with the gate's compile (empty reads none)
        type: string
        default: ""
  schedule:
    - cron: "23 4 * * 1"
    - cron: "23 4 1 * *"

permissions:
  contents: read

concurrency:
  # Every accepted handoff keeps its run, including multiple queued main revisions.
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PYTHONUNBUFFERED: "1"
  GUEST_REVISION: ${{ inputs.revision || github.sha }}
  GUEST_COLD: ${{ inputs.cold == true || github.event.schedule == '23 4 1 * *' }}
  # GNU time's figures for each command, including the peak resident memory of its
  # largest process, which sizes the proof gate's kernel workers.
  GUEST_TIME: 'real %e\nuser %U\nsys %S\nmaxrss_kb %M'

defaults:
  run:
    # Explicit bash enables pipefail, so tee cannot hide a gate failure.
    shell: bash

jobs:
  changes:
    # Manual dispatch, monthly cold runs and explicit reruns always execute.
    if: ${{ github.event.schedule == '23 4 * * 1' && github.run_attempt == 1 }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: read # the previous run's conclusion and artifact names
    outputs:
      unchanged: ${{ steps.previous.outputs.unchanged }}
    steps:
      - name: Check the previous completed run
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          unchanged=false
          api="repos/$GITHUB_REPOSITORY/actions"
          if previous=$(gh api --method GET "$api/workflows/guest-gates.yml/runs" \
            -f branch="$GITHUB_REF_NAME" -f status=completed -F per_page=1 \
            --jq '.workflow_runs[0] | [.id, .event, .head_sha, .conclusion] | @tsv'); then
            IFS=$'\t' read -r run event head conclusion <<< "$previous"
            if [[ "$conclusion" == success && "$event" == schedule ]]; then
              # A scheduled run checks out its own head_sha.
              if [[ "$head" == "$GITHUB_SHA" ]]; then
                unchanged=true
              fi
            elif [[ "$conclusion" == success && "$event" == workflow_dispatch ]]; then
              # A dispatched run can pin an older revision than its main head_sha, so
              # every lane's artifact name must carry the checked-out revision.
              if names=$(gh api --method GET "$api/runs/$run/artifacts" -F per_page=100 \
                --jq '.artifacts[].name'); then
                if grep -q "^guest-model-$GITHUB_SHA-" <<< "$names" \
                  && grep -q "^guest-rtl-$GITHUB_SHA-" <<< "$names" \
                  && grep -q "^guest-proofs-$GITHUB_SHA-" <<< "$names"; then
                  unchanged=true
                fi
              else
                echo "::warning::Could not read the previous run's artifacts; running all guest gates."
              fi
            fi
            if [[ "$unchanged" == true ]]; then
              echo "Scheduled guest gates skipped: revision $GITHUB_SHA already passed." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "::warning::Could not read run history; running all guest gates."
          fi
          echo "unchanged=$unchanged" >> "$GITHUB_OUTPUT"

  guest-gates:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.unchanged != 'true' }}
    runs-on: ubuntu-26.04
    # A job that reaches this limit is cancelled before its report and upload, so each
    # lane's step limits sum at least 30 minutes under it. That margin is left to the
    # steps without a limit of their own, setup, caches, report and upload, which took
    # under a minute in total in every measured hosted run.
    timeout-minutes: 360
    strategy:
      # One lane's failure must not cancel another lane's verdict.
      fail-fast: false
      matrix:
        # A lane restores the download and installed-toolchain caches of its cache_lane,
        # whose toolchains it selects, and saves them only when that lane is its own.
        include:
          - lane: model
            cache_lane: model
            toolchains: --toolchain sail --toolchain rtl
          - lane: rtl
            cache_lane: model
            toolchains: --toolchain sail --toolchain rtl
          - lane: proofs
            cache_lane: proofs
            toolchains: --toolchain rocq
    env:
      # Source downloads and the ownership marker that lets bootstrap resume the root;
      # no installed switches, build outputs or verdicts.
      GUEST_DOWNLOAD_PATHS: |
        ~/verifiedos-guest/.verifiedos-guest-root
        ~/verifiedos-guest/opam/download-cache
        ~/verifiedos-guest/build/verilator-*-source/*.tar.gz
      # Installed toolchains and the ownership marker that lets bootstrap resume
      # them; never download caches, build trees, logs or evidence.
      GUEST_TOOLCHAIN_PATHS: |
        ~/verifiedos-guest/.verifiedos-guest-root
        ~/verifiedos-guest/opam
        !~/verifiedos-guest/opam/download-cache
        !~/verifiedos-guest/opam/log
        ~/verifiedos-guest/build/toolchains
      # Only the native receipt, staged sources and compiled objects are reusable.
      # The proof gate validates their bytes and context; a cache hit is no verdict.
      GUEST_PROOF_PATHS: |
        ~/verifiedos-guest/build/proof-gate/proofs/*.v
        ~/verifiedos-guest/build/proof-gate/proofs/*.vo
        ~/verifiedos-guest/build/proof-gate/proofs/proof-evidence.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          # These gates need indexed pins, not imported-core source trees.
          submodules: false

      - name: Verify dispatched revision belongs to main
        id: dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: python
        env:
          REQUESTED_REVISION: ${{ inputs.revision || github.sha }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_MAIN_SHA: ${{ github.sha }}
          READING_BASE: ${{ inputs.reading_base }}
        run: |
          import os
          import re
          import subprocess

          revision = os.environ["REQUESTED_REVISION"]
          if os.environ["DISPATCH_REF"] != "refs/heads/main" or not re.fullmatch(r"[0-9a-f]{40}", revision):
              raise SystemExit("Dispatch must use main and a full lowercase commit SHA")
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if actual != revision:
              raise SystemExit("Checkout does not match the requested revision")
          subprocess.run(["git", "merge-base", "--is-ancestor", revision,
                          os.environ["DISPATCH_MAIN_SHA"]], check=True)
          # A nonempty reading base is a commit the revision strictly descends from.
          base = os.environ.get("READING_BASE", "")
          if base:
              if not re.fullmatch(r"[0-9a-f]{40}", base) or base == revision:
                  raise SystemExit("reading_base must be a full lowercase commit SHA other than the revision")
              named = subprocess.run(["git", "rev-parse", "--verify", "--quiet", base + "^{commit}"],
                                     capture_output=True, text=True, check=False)
              if named.returncode or named.stdout.strip() != base:
                  raise SystemExit("reading_base names no commit in the checkout's history")
              if subprocess.run(["git", "merge-base", "--is-ancestor", base, revision],
                                check=False).returncode:
                  raise SystemExit("reading_base is not an ancestor of the revision")

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version-file: tools/pyproject.toml
          enable-cache: true
          # Every lane resolves the same lockfile; one saver avoids a racing upload.
          save-cache: ${{ github.ref == 'refs/heads/main' && matrix.lane == 'model' }}
          # The key names the runner image but no workflow; the suffix keeps Host CI's
          # smaller download set from claiming it on a shared image. The boot
          # signature campaign restores this cache under the same suffix.
          cache-suffix: guest-gates
          cache-dependency-glob: |
            tools/pyproject.toml
            tools/uv.lock

      - name: Cache guest source downloads
        if: ${{ matrix.cache_lane == matrix.lane }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GUEST_DOWNLOAD_PATHS }}
          key: guest-downloads-v1-${{ matrix.cache_lane }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/opam/sail.lock', 'tools/opam/rocq.lock', 'tools/ci/bootstrap_guest.py', 'tools/vos/opam_client.py', 'tools/vos/cli/rtl.py', 'tools/vos/receipts.py') }}
          restore-keys: guest-downloads-v1-${{ matrix.cache_lane }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore another lane's source downloads
        # The same key as the step above, restored without the save that would race
        # the cache lane's own.
        if: ${{ matrix.cache_lane != matrix.lane }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GUEST_DOWNLOAD_PATHS }}
          key: guest-downloads-v1-${{ matrix.cache_lane }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/opam/sail.lock', 'tools/opam/rocq.lock', 'tools/ci/bootstrap_guest.py', 'tools/vos/opam_client.py', 'tools/vos/cli/rtl.py', 'tools/vos/receipts.py') }}
          restore-keys: guest-downloads-v1-${{ matrix.cache_lane }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Identify the runner image
        id: image
        env:
          GUEST_CACHE_LANE: ${{ matrix.cache_lane }}
        # Installed toolchains link the image's system libraries. The Rocq switch links
        # only the C library, whose ABI a release keeps and whose bytes the proof gate
        # binds, so the proofs lane shares one switch across the release's images. A
        # rebuilt switch reproduces its executables but not every library file, so no
        # earlier proof evidence would validate against it. The component follows the
        # cache's lane, whose installation a lane restores.
        run: |
          version="${ImageOS:-unknown}-${ImageVersion:-unknown}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GUEST_CACHE_LANE" == proofs ]]; then
            echo "toolchain=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"
          else
            echo "toolchain=$version" >> "$GITHUB_OUTPUT"
          fi

      - name: Identify the toolchain recipe
        id: recipe
        env:
          GUEST_TOOLCHAIN_OPTIONS: ${{ matrix.toolchains }}
        # The SHA-256 of the owner data that decides the selection's installed bytes,
        # which bootstrap_guest.py's `recipe` states: its packages, the opam client's pin,
        # each switch's recipe and snapshot bytes and the Verilator pin. Other edits to
        # bootstrap or the client's owner keep the key; the key's v1 is raised by hand
        # for an installation-procedure change that data does not capture. A lane
        # selects its cache lane's toolchains, so the identity is that lane's.
        run: |
          read -r -a toolchain_options <<< "$GUEST_TOOLCHAIN_OPTIONS"
          identity=$(python3 tools/ci/bootstrap_guest.py --print-recipe-identity \
            "${toolchain_options[@]}")
          if [[ ! "$identity" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::bootstrap printed no toolchain recipe identity: $identity"
            exit 1
          fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      - name: Restore installed toolchains
        id: toolchains
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GUEST_TOOLCHAIN_PATHS }}
          # Bootstrap imports each lock into a restored switch and probes every tool.
          # Exact keys only: another snapshot's switch is never restored.
          key: guest-toolchains-v1-${{ matrix.cache_lane }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.toolchain }}-${{ steps.recipe.outputs.identity }}
          # A cold run only learns whether the installation needs saving.
          lookup-only: ${{ env.GUEST_COLD == 'true' }}

      - name: Bootstrap guest toolchains
        id: bootstrap
        # A cold installation took at most 14.3 minutes on a hosted runner in the model
        # lane and 11.7 in the proofs lane, and a restored one less.
        timeout-minutes: 120
        env:
          GUEST_TOOLCHAIN_OPTIONS: ${{ matrix.toolchains }}
        run: |
          read -r -a toolchain_options <<< "$GUEST_TOOLCHAIN_OPTIONS"
          /usr/bin/time -f "$GUEST_TIME" python3 tools/ci/bootstrap_guest.py \
            --root "$HOME/verifiedos-guest" --install-system "${toolchain_options[@]}" \
            --github-env "$GITHUB_ENV" --github-path "$GITHUB_PATH" \
            2>&1 | tee "$RUNNER_TEMP/guest-bootstrap-console.log"

      - name: Save installed toolchains
        # Saved from main once the probes pass, so a later gate failure keeps them, and
        # only by the lane whose cache it is.
        if: ${{ github.ref == 'refs/heads/main' && matrix.cache_lane == matrix.lane && steps.bootstrap.outcome == 'success' && steps.toolchains.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GUEST_TOOLCHAIN_PATHS }}
          key: ${{ steps.toolchains.outputs.cache-primary-key }}

      - name: Identify the Sail solver
        id: solver
        if: ${{ (matrix.lane == 'model' || matrix.lane == 'rtl') && !cancelled() && steps.dispatch.outcome != 'failure' && steps.bootstrap.outcome == 'success' }}
        # The memo only accelerates the build; without an identity the build runs cold.
        continue-on-error: true
        # Sail's memo keys each obligation, not the solver that answered it, so a
        # memo never crosses the installed Sail, Z3 or snapshot bootstrap recorded.
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json
          import os
          from pathlib import Path

          record = json.loads((Path(os.environ["VOS_LOG_DIR"]) / "bootstrap.json").read_text(encoding="utf-8"))
          print(f"identity=sail-{record['sail']}-z3-{record['z3']}-{record['snapshots']['sail'][:16]}")
          PY

      - name: Restore the Sail memo
        id: sail-memo
        # The model lane's build and the rtl lane's bundle each read a private copy.
        if: ${{ (matrix.lane == 'model' || matrix.lane == 'rtl') && !cancelled() && steps.solver.outcome == 'success' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # A private copy Sail seeds itself from; the build tree stays uncached.
          path: ${{ env.VOS_BUILD_DIR }}/model/sail_smt_cache
          key: guest-sail-memo-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.version }}-${{ steps.solver.outputs.identity }}-${{ hashFiles('model/model/**') }}
          # An older model's memo costs misses, never a wrong verdict, within one solver.
          restore-keys: guest-sail-memo-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.version }}-${{ steps.solver.outputs.identity }}-
          # A cold run discharges every obligation again.
          lookup-only: ${{ env.GUEST_COLD == 'true' }}

      - name: Model evidence
        id: evidence
        if: ${{ matrix.lane == 'model' && !cancelled() && steps.dispatch.outcome != 'failure' && steps.bootstrap.outcome == 'success' }}
        # The sweep took at most 12.1 minutes on a hosted runner, with a cold Sail memo.
        timeout-minutes: 150
        # The proofs lane runs the proof gate, and the rtl lane the bundle and RTL
        # checks, each on its own runner.
        run: |
          /usr/bin/time -f "$GUEST_TIME" python3 tools/run.py evidence --no-proofs \
            --out "$VOS_LOG_DIR/evidence.json" \
            2>&1 | tee "$VOS_LOG_DIR/evidence-console.log"

      - name: Save the Sail memo
        # Sail rewrites the memo whole at exit; one writer per runner keeps it intact.
        # Only the model lane saves it, after a passing sweep; the rtl lane never does.
        if: ${{ github.ref == 'refs/heads/main' && matrix.lane == 'model' && !cancelled() && steps.evidence.outcome == 'success' && steps.sail-memo.outcome == 'success' && steps.sail-memo.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VOS_BUILD_DIR }}/model/sail_smt_cache
          key: ${{ steps.sail-memo.outputs.cache-primary-key }}

      - name: Identify the proof context
        id: proof-context
        if: ${{ matrix.lane == 'proofs' && !cancelled() && steps.dispatch.outcome != 'failure' && steps.bootstrap.outcome == 'success' }}
        # Candidates only accelerate the gate; without an identity it checks everything.
        continue-on-error: true
        # Give the identity and every proof gate the SAME explicit environment.
        # Actions' per-run IDs and file-command paths must not force an otherwise
        # valid cache miss. The gate still hashes its entire actual environment,
        # tools and libraries.
        run: |
          proof_env=(HOME="$HOME" PATH="$PATH" LANG=C.UTF-8
            PYTHONUTF8=1 PYTHONUNBUFFERED=1 TMPDIR="$TMPDIR"
            VOS_BUILD_ROOT="$VOS_BUILD_ROOT" VOS_LANE=
            VOS_ROCQ="$VOS_ROCQ" VOS_ROCQCHK="$VOS_ROCQCHK"
            OPAMROOT="$OPAMROOT" UV_CACHE_DIR="$UV_CACHE_DIR")
          printf '%s\0' "${proof_env[@]}" > "$RUNNER_TEMP/proof-environment"
          identity=$(env -i "${proof_env[@]}" python3 tools/run.py proofs identity)
          if [[ ! "$identity" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::warning::The proof gate printed no context identity: $identity"
            exit 1
          fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      - name: Restore proof cache candidates
        id: proof-cache
        if: ${{ matrix.lane == 'proofs' && !cancelled() && steps.proof-context.outcome == 'success' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GUEST_PROOF_PATHS }}
          # The gate's identity stands for the image, Rocq snapshot and bootstrap: every
          # image whose toolchain and context the gate accepts shares one lineage, and
          # no other context's candidates are offered.
          key: guest-proofs-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.proof-context.outputs.identity }}-${{ hashFiles('proofs/*.v', 'tools/**/*.py', 'tools/pyproject.toml', 'tools/uv.lock', 'docs/requirements-register.md', '.github/workflows/guest-gates.yml') }}
          # Older sources are candidates for the gate's dependency-aware validation.
          restore-keys: guest-proofs-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.proof-context.outputs.identity }}-
          lookup-only: ${{ env.GUEST_COLD == 'true' }}

      - name: Proof gate
        id: proofs
        if: ${{ matrix.lane == 'proofs' && !cancelled() && steps.dispatch.outcome != 'failure' && steps.bootstrap.outcome == 'success' }}
        timeout-minutes: 120
        # Cold and warm proofs run in the explicit environment the identity step fixed.
        run: |
          fresh=()
          if [[ "$GUEST_COLD" == true ]]; then
            fresh=(--fresh)
            echo "Proof policy: fresh compilation, audits and full kernel recheck." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Proof policy: validate native cache candidates; rebuild and recheck anything stale. See proofs.log for actual reuse." >> "$GITHUB_STEP_SUMMARY"
          fi
          mapfile -d '' -t proof_env < "$RUNNER_TEMP/proof-environment"
          /usr/bin/time -f "$GUEST_TIME" env -i "${proof_env[@]}" \
            python3 tools/run.py proofs "${fresh[@]}" \
            2>&1 | tee "$VOS_LOG_DIR/proofs.log"

      - name: Save validated proof cache
        # A rebuilt toolchain may differ byte-for-byte from an existing immutable
        # installation cache. Seed cold proof results only with a new toolchain key.
        if: ${{ github.ref == 'refs/heads/main' && !cancelled() && steps.proofs.outcome == 'success' && steps.proof-cache.outcome == 'success' && steps.proof-cache.outputs.cache-hit != 'true' && (env.GUEST_COLD != 'true' || steps.toolchains.outputs.cache-hit != 'true') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GUEST_PROOF_PATHS }}
          key: ${{ steps.proof-cache.outputs.cache-primary-key }}

      - name: Read the proofs against the reading base
        id: reading
        # Only a dispatch naming a reading base runs it, over a passing gate's compile.
        if: ${{ matrix.lane == 'proofs' && !cancelled() && steps.dispatch.outcome != 'failure' && inputs.reading_base != '' && steps.proofs.outcome == 'success' }}
        # Each reading of the whole corpus, compile included, took about 245 s on the
        # development guest. An hour bounds both on a runner and keeps the proofs lane's
        # step limits under the job's, which a timed-out job would cut short before its
        # report and artifact upload.
        timeout-minutes: 60
        env:
          READING_BASE: ${{ inputs.reading_base }}
        # Both readings and the comparison run in the gate's explicit environment, and
        # the base's sources come from its own commit, never from the checkout's tree.
        # The step passes once both readings are recorded and compared: it logs every
        # difference the comparison names, and a refused reading or comparison fails it.
        run: |
          if [[ ! "$READING_BASE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::reading_base is not a full lowercase commit SHA"
            exit 1
          fi
          base="$VOS_LOG_DIR/proof-reading-base.json"
          candidate="$VOS_LOG_DIR/proof-reading-candidate.json"
          comparison="$VOS_LOG_DIR/proof-reading-compare.log"
          sources="$RUNNER_TEMP/proof-reading-base"
          rm -rf -- "$sources" "$base" "$candidate" "$comparison"
          mkdir -p -- "$sources"
          git archive --format=tar "$READING_BASE" proofs | tar -x -C "$sources"
          mapfile -d '' -t proof_env < "$RUNNER_TEMP/proof-environment"
          /usr/bin/time -f "$GUEST_TIME" env -i "${proof_env[@]}" \
            python3 tools/run.py proof-reading record --out "$candidate" \
            2>&1 | tee "$VOS_LOG_DIR/proof-reading-candidate.log"
          /usr/bin/time -f "$GUEST_TIME" env -i "${proof_env[@]}" \
            python3 tools/run.py proof-reading record --sources "$sources/proofs" --out "$base" \
            2>&1 | tee "$VOS_LOG_DIR/proof-reading-base.log"
          # The comparison's log is its standard output alone, which names each difference.
          compared=0
          /usr/bin/time -f "$GUEST_TIME" -o "$VOS_LOG_DIR/proof-reading-compare.time" \
            env -i "${proof_env[@]}" \
            python3 tools/run.py proof-reading compare "$base" "$candidate" \
            > "$comparison" || compared=$?
          cat -- "$comparison" "$VOS_LOG_DIR/proof-reading-compare.time"
          first=$(head -n 1 -- "$comparison")
          count=${first#"FAIL proof-reading: "}
          count=${count%" difference(s) between $base and $candidate"}
          if (( compared == 0 )); then
            echo "Proof reading against \`$READING_BASE\`: the two readings are identical." >> "$GITHUB_STEP_SUMMARY"
          elif (( compared == 1 )) && [[ "$count" =~ ^[0-9]+$ && "$first" == "FAIL proof-reading: $count difference(s) between $base and $candidate" ]]; then
            echo "Proof reading against \`$READING_BASE\`: $count difference(s), each named in proof-reading-compare.log." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::proof-reading compare refused the readings rather than comparing them"
            exit 1
          fi
          # The digests outlast the artifact in the run's log and summary.
          for reading in "$base" "$candidate"; do
            digest=$(sha256sum -- "$reading")
            echo "- \`${reading##*/}\` SHA-256 \`${digest%% *}\`" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: Check generated model bundle
        id: bundle
        if: ${{ matrix.lane == 'rtl' && !cancelled() && steps.dispatch.outcome != 'failure' && steps.bootstrap.outcome == 'success' }}
        # The emission took at most 32 s on a hosted runner over a memo a passing sweep
        # warmed. An older model's restored memo, or a cold run's empty one, is expected
        # to add about the 6 minutes a cold memo adds to the sweep, an estimate no hosted
        # run has measured yet.
        timeout-minutes: 15
        # This lane builds no model tree, so the directory holding the memo Sail rewrites
        # at exit stands only where a memo was restored.
        run: |
          mkdir -p -- "$VOS_BUILD_DIR/model"
          /usr/bin/time -f "$GUEST_TIME" python3 tools/run.py model bundle --check \
            2>&1 | tee "$VOS_LOG_DIR/bundle.log"

      - name: Lint standalone RTL
        id: lint
        if: ${{ matrix.lane == 'rtl' && !cancelled() && steps.dispatch.outcome != 'failure' && steps.bootstrap.outcome == 'success' }}
        # Lint took at most a second on a hosted runner.
        timeout-minutes: 5
        run: |
          /usr/bin/time -f "$GUEST_TIME" python3 tools/run.py rtl lint \
            2>&1 | tee "$VOS_LOG_DIR/rtl-lint.log"

      - name: Check frozen RTL widths and store lanes
        id: widthcheck
        if: ${{ matrix.lane == 'rtl' && !cancelled() && steps.dispatch.outcome != 'failure' && steps.bootstrap.outcome == 'success' }}
        # Building and running the testbench took at most 14 s on a hosted runner.
        timeout-minutes: 5
        run: |
          /usr/bin/time -f "$GUEST_TIME" python3 tools/run.py rtl widthcheck \
            2>&1 | tee "$VOS_LOG_DIR/rtl-widthcheck.log"

      - name: Crosscheck RTL against fresh model vectors
        id: crosscheck
        if: ${{ matrix.lane == 'rtl' && !cancelled() && steps.dispatch.outcome != 'failure' && steps.bootstrap.outcome == 'success' }}
        # Building the vector generator, emitting the vectors and replaying them took
        # at most 98 s on a hosted runner.
        timeout-minutes: 30
        run: |
          /usr/bin/time -f "$GUEST_TIME" python3 tools/run.py rtl crosscheck \
            2>&1 | tee "$VOS_LOG_DIR/rtl-crosscheck.log"

      - name: Report guest results
        if: ${{ !cancelled() && steps.dispatch.outcome != 'failure' }}
        env:
          GUEST_LANE: ${{ matrix.lane }}
          # A restored run is not evidence that the toolchains install cold.
          GUEST_TOOLCHAINS: ${{ env.GUEST_COLD != 'true' && steps.toolchains.outputs.cache-hit == 'true' && 'restored' || 'cold' }}
          # A restored memo's verdicts were not discharged again in this run.
          GUEST_SAIL_MEMO: ${{ (matrix.lane == 'model' || matrix.lane == 'rtl') && (env.GUEST_COLD != 'true' && steps.sail-memo.outputs.cache-matched-key != '' && 'restored' || 'cold') || '' }}
          # Only the proofs lane reads proofs against a base.
          GUEST_READING_BASE: ${{ matrix.lane == 'proofs' && inputs.reading_base || '' }}
          STEP_RESULTS: ${{ toJSON(steps) }}
        run: python3 tools/ci/report_guest.py

      - name: Preserve guest logs and receipts
        # The pinned action runs no checked-out code. After a refused dispatch no step
        # has written the log directory, so it finds no files and uploads nothing.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: guest-${{ matrix.lane }}-${{ env.GUEST_REVISION }}-${{ github.run_attempt }}
          path: ~/verifiedos-guest/logs/
          if-no-files-found: error
          retention-days: 14
