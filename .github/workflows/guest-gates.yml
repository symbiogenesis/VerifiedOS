# SPDX-License-Identifier: Apache-2.0
# Native Linux evidence for Sail, Rocq and standalone RTL; tools/ci/README.md
# defines the scope. Download caches accelerate fresh toolchains and evidence.

name: guest-gates

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PYTHONUNBUFFERED: "1"

defaults:
  run:
    # Explicit bash enables pipefail, so tee cannot hide a gate failure.
    shell: bash

jobs:
  changes:
    # Manual dispatch and explicit reruns always execute the gates.
    if: ${{ github.event_name == 'schedule' && github.run_attempt == 1 }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      unchanged: ${{ steps.previous.outputs.unchanged }}
    steps:
      - name: Check the previous completed run
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          unchanged=false
          if previous=$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/guest-gates.yml/runs" \
            -f branch="$GITHUB_REF_NAME" -f status=completed -F per_page=1 \
            --jq '.workflow_runs[0] | [.head_sha, .conclusion] | @tsv'); then
            if [[ "$previous" == "$GITHUB_SHA"$'\t'success ]]; then
              unchanged=true
              echo "Scheduled guest gates skipped: revision $GITHUB_SHA already passed." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "::warning::Could not read run history; running all guest gates."
          fi
          echo "unchanged=$unchanged" >> "$GITHUB_OUTPUT"

  guest-gates:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.unchanged != 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # These gates need indexed pins, not imported-core source trees.
          submodules: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version-file: tools/pyproject.toml
          enable-cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          cache-dependency-glob: |
            tools/pyproject.toml
            tools/uv.lock

      - name: Cache guest source downloads
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          # The ownership marker lets bootstrap resume this private root.
          # No installed switches, build outputs or verdicts are restored.
          path: |
            ~/verifiedos-guest/.verifiedos-guest-root
            ~/verifiedos-guest/opam/download-cache
            ~/verifiedos-guest/build/verilator-*-source/*.tar.gz
          key: guest-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/opam/sail.lock', 'tools/opam/rocq.lock', 'tools/ci/bootstrap_guest.py', 'tools/vos/cli/rtl.py') }}
          restore-keys: guest-downloads-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Bootstrap guest toolchains
        id: bootstrap
        timeout-minutes: 120
        run: |
          /usr/bin/time -p python3 tools/ci/bootstrap_guest.py \
            --root "$HOME/verifiedos-guest" --jobs 2 --install-system \
            --github-env "$GITHUB_ENV" --github-path "$GITHUB_PATH" \
            2>&1 | tee "$RUNNER_TEMP/guest-bootstrap-console.log"

      - name: Model and proof evidence
        id: evidence
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        timeout-minutes: 180
        # evidence already overlaps proofs with the model consumers.
        run: |
          /usr/bin/time -p python3 tools/run.py evidence --out "$VOS_LOG_DIR/evidence.json" \
            2>&1 | tee "$VOS_LOG_DIR/evidence-console.log"

      - name: Check generated model bundle
        id: bundle
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        timeout-minutes: 15
        run: |
          /usr/bin/time -p python3 tools/run.py model bundle --check \
            2>&1 | tee "$VOS_LOG_DIR/bundle.log"

      - name: Lint standalone RTL
        id: lint
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          /usr/bin/time -p python3 tools/run.py rtl lint \
            2>&1 | tee "$VOS_LOG_DIR/rtl-lint.log"

      - name: Crosscheck RTL against fresh model vectors
        id: crosscheck
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        timeout-minutes: 30
        run: |
          /usr/bin/time -p python3 tools/run.py rtl crosscheck \
            2>&1 | tee "$VOS_LOG_DIR/rtl-crosscheck.log"

      - name: Report guest results
        if: ${{ !cancelled() }}
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
        run: python3 tools/ci/report_guest.py

      - name: Preserve guest logs and receipts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: guest-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: ~/verifiedos-guest/logs/
          if-no-files-found: error
          retention-days: 14
