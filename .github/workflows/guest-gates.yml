# SPDX-License-Identifier: Apache-2.0
# Native Linux evidence for Sail, Rocq and standalone RTL; tools/ci/README.md
# defines the scope. Ordinary runs restore toolchains, validated proof inputs and
# the model lane's Sail solver memo. Monthly and explicitly cold runs install and
# check everything from scratch.
# The model and proof lanes share no toolchain or output, so each installs only
# its own toolchains and runs on its own runner. Manual dispatch runs from main;
# its optional revision input pins checkout to a commit already on main, verified
# before any checked-out code runs. A run title follows the workflow name with the
# title input, which fanout fills with the commit subject, or else with the
# checked-out revision.

name: guest-gates
run-name: ${{ format('{0}:{1}', github.workflow, inputs.title || inputs.revision || github.sha) }}

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full commit SHA already on main (empty selects current main)
        type: string
        default: ""
      title:
        description: Optional run title text after the workflow name (empty shows the revision)
        type: string
        default: ""
      cold:
        description: Install toolchains cold and recompile/recheck every proof
        type: boolean
        default: false
  schedule:
    - cron: "23 4 * * 1"
    - cron: "23 4 1 * *"

permissions:
  contents: read

concurrency:
  # Every accepted handoff keeps its run, including multiple queued main revisions.
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PYTHONUNBUFFERED: "1"
  GUEST_REVISION: ${{ inputs.revision || github.sha }}
  GUEST_COLD: ${{ inputs.cold == true || github.event.schedule == '23 4 1 * *' }}
  # GNU time's figures for each command, including the peak resident memory of its
  # largest process, which sizes the proof gate's kernel workers.
  GUEST_TIME: 'real %e\nuser %U\nsys %S\nmaxrss_kb %M'

defaults:
  run:
    # Explicit bash enables pipefail, so tee cannot hide a gate failure.
    shell: bash

jobs:
  changes:
    # Manual dispatch, monthly cold runs and explicit reruns always execute.
    if: ${{ github.event.schedule == '23 4 * * 1' && github.run_attempt == 1 }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      unchanged: ${{ steps.previous.outputs.unchanged }}
    steps:
      - name: Check the previous completed run
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          unchanged=false
          api="repos/$GITHUB_REPOSITORY/actions"
          if previous=$(gh api --method GET "$api/workflows/guest-gates.yml/runs" \
            -f branch="$GITHUB_REF_NAME" -f status=completed -F per_page=1 \
            --jq '.workflow_runs[0] | [.id, .event, .head_sha, .conclusion] | @tsv'); then
            IFS=$'\t' read -r run event head conclusion <<< "$previous"
            if [[ "$conclusion" == success && "$event" == schedule ]]; then
              # A scheduled run checks out its own head_sha.
              if [[ "$head" == "$GITHUB_SHA" ]]; then
                unchanged=true
              fi
            elif [[ "$conclusion" == success && "$event" == workflow_dispatch ]]; then
              # A dispatched run can pin an older revision than its main head_sha, so
              # both lanes' artifact names must carry the checked-out revision.
              if names=$(gh api --method GET "$api/runs/$run/artifacts" -F per_page=100 \
                --jq '.artifacts[].name'); then
                if grep -q "^guest-model-$GITHUB_SHA-" <<< "$names" \
                  && grep -q "^guest-proofs-$GITHUB_SHA-" <<< "$names"; then
                  unchanged=true
                fi
              else
                echo "::warning::Could not read the previous run's artifacts; running all guest gates."
              fi
            fi
            if [[ "$unchanged" == true ]]; then
              echo "Scheduled guest gates skipped: revision $GITHUB_SHA already passed." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "::warning::Could not read run history; running all guest gates."
          fi
          echo "unchanged=$unchanged" >> "$GITHUB_OUTPUT"

  guest-gates:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.unchanged != 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    strategy:
      # One lane's failure must not cancel the other lane's verdict.
      fail-fast: false
      matrix:
        include:
          - lane: model
            toolchains: --toolchain sail --toolchain rtl
          - lane: proofs
            toolchains: --toolchain rocq
    env:
      # Installed toolchains and the ownership marker that lets bootstrap resume
      # them; never download caches, build trees, logs or evidence.
      GUEST_TOOLCHAIN_PATHS: |
        ~/verifiedos-guest/.verifiedos-guest-root
        ~/verifiedos-guest/opam
        !~/verifiedos-guest/opam/download-cache
        !~/verifiedos-guest/opam/log
        ~/verifiedos-guest/build/toolchains
      # Only the native receipt, staged sources and compiled objects are reusable.
      # The proof gate validates their bytes and context; a cache hit is no verdict.
      GUEST_PROOF_PATHS: |
        ~/verifiedos-guest/build/proof-gate/proofs/*.v
        ~/verifiedos-guest/build/proof-gate/proofs/*.vo
        ~/verifiedos-guest/build/proof-gate/proofs/proof-evidence.json
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          # These gates need indexed pins, not imported-core source trees.
          submodules: false

      - name: Verify dispatched revision belongs to main
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: python
        env:
          REQUESTED_REVISION: ${{ inputs.revision || github.sha }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_MAIN_SHA: ${{ github.sha }}
        run: |
          import os
          import re
          import subprocess

          revision = os.environ["REQUESTED_REVISION"]
          if os.environ["DISPATCH_REF"] != "refs/heads/main" or not re.fullmatch(r"[0-9a-f]{40}", revision):
              raise SystemExit("Dispatch must use main and a full lowercase commit SHA")
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if actual != revision:
              raise SystemExit("Checkout does not match the requested revision")
          subprocess.run(["git", "merge-base", "--is-ancestor", revision,
                          os.environ["DISPATCH_MAIN_SHA"]], check=True)

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version-file: tools/pyproject.toml
          enable-cache: true
          # Both lanes resolve the same lockfile; one saver avoids a racing upload.
          save-cache: ${{ github.ref == 'refs/heads/main' && matrix.lane == 'model' }}
          cache-dependency-glob: |
            tools/pyproject.toml
            tools/uv.lock

      - name: Cache guest source downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # The ownership marker lets bootstrap resume this private root.
          # No installed switches, build outputs or verdicts are restored.
          path: |
            ~/verifiedos-guest/.verifiedos-guest-root
            ~/verifiedos-guest/opam/download-cache
            ~/verifiedos-guest/build/verilator-*-source/*.tar.gz
          key: guest-downloads-v1-${{ matrix.lane }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/opam/sail.lock', 'tools/opam/rocq.lock', 'tools/ci/bootstrap_guest.py', 'tools/vos/cli/rtl.py', 'tools/vos/receipts.py') }}
          restore-keys: guest-downloads-v1-${{ matrix.lane }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Identify the runner image
        id: image
        env:
          GUEST_LANE: ${{ matrix.lane }}
        # Installed toolchains link the image's system libraries. The Rocq switch links
        # only the C library, whose ABI a release keeps and whose bytes the proof gate
        # binds, so the proofs lane shares one switch across the release's images. A
        # rebuilt switch reproduces its executables but not every library file, so no
        # earlier proof evidence would validate against it.
        run: |
          version="${ImageOS:-unknown}-${ImageVersion:-unknown}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GUEST_LANE" == proofs ]]; then
            echo "toolchain=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"
          else
            echo "toolchain=$version" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore installed toolchains
        id: toolchains
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GUEST_TOOLCHAIN_PATHS }}
          # Switch names and the Verilator prefix carry their versions, and bootstrap
          # imports each lock into a restored switch, so env.py and rtl.py stay out.
          # Exact keys only: another snapshot's switch is never restored.
          key: guest-toolchains-v1-${{ matrix.lane }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.toolchain }}-${{ hashFiles('tools/opam/sail.lock', 'tools/opam/rocq.lock', 'tools/ci/bootstrap_guest.py') }}
          # A cold run only learns whether the installation needs saving.
          lookup-only: ${{ env.GUEST_COLD == 'true' }}

      - name: Bootstrap guest toolchains
        id: bootstrap
        timeout-minutes: 120
        run: |
          /usr/bin/time -f "$GUEST_TIME" python3 tools/ci/bootstrap_guest.py \
            --root "$HOME/verifiedos-guest" --install-system ${{ matrix.toolchains }} \
            --github-env "$GITHUB_ENV" --github-path "$GITHUB_PATH" \
            2>&1 | tee "$RUNNER_TEMP/guest-bootstrap-console.log"

      - name: Save installed toolchains
        # Saved from main once the probes pass, so a later gate failure keeps them.
        if: ${{ github.ref == 'refs/heads/main' && steps.bootstrap.outcome == 'success' && steps.toolchains.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GUEST_TOOLCHAIN_PATHS }}
          key: ${{ steps.toolchains.outputs.cache-primary-key }}

      - name: Identify the Sail solver
        id: solver
        if: ${{ matrix.lane == 'model' && !cancelled() && steps.bootstrap.outcome == 'success' }}
        # The memo only accelerates the build; without an identity the build runs cold.
        continue-on-error: true
        # Sail's memo keys each obligation, not the solver that answered it, so a
        # memo never crosses the installed Sail, Z3 or snapshot bootstrap recorded.
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json
          import os
          from pathlib import Path

          record = json.loads((Path(os.environ["VOS_LOG_DIR"]) / "bootstrap.json").read_text(encoding="utf-8"))
          print(f"identity=sail-{record['sail']}-z3-{record['z3']}-{record['snapshots']['sail'][:16]}")
          PY

      - name: Restore the Sail memo
        id: sail-memo
        if: ${{ matrix.lane == 'model' && !cancelled() && steps.solver.outcome == 'success' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # A private copy the build seeds itself from; the build tree stays uncached.
          path: ${{ env.VOS_BUILD_DIR }}/model/sail_smt_cache
          key: guest-sail-memo-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.version }}-${{ steps.solver.outputs.identity }}-${{ hashFiles('model/model/**') }}
          # An older model's memo costs misses, never a wrong verdict, within one solver.
          restore-keys: guest-sail-memo-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.version }}-${{ steps.solver.outputs.identity }}-
          # A cold run discharges every obligation again.
          lookup-only: ${{ env.GUEST_COLD == 'true' }}

      - name: Model evidence
        id: evidence
        if: ${{ matrix.lane == 'model' && !cancelled() && steps.bootstrap.outcome == 'success' }}
        timeout-minutes: 180
        # The proofs lane runs the proof gate on its own runner.
        run: |
          /usr/bin/time -f "$GUEST_TIME" python3 tools/run.py evidence --no-proofs \
            --out "$VOS_LOG_DIR/evidence.json" \
            2>&1 | tee "$VOS_LOG_DIR/evidence-console.log"

      - name: Save the Sail memo
        # Sail rewrites the memo whole at exit; one writer per runner keeps it intact.
        if: ${{ github.ref == 'refs/heads/main' && !cancelled() && steps.evidence.outcome == 'success' && steps.sail-memo.outcome == 'success' && steps.sail-memo.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VOS_BUILD_DIR }}/model/sail_smt_cache
          key: ${{ steps.sail-memo.outputs.cache-primary-key }}

      - name: Identify the proof context
        id: proof-context
        if: ${{ matrix.lane == 'proofs' && !cancelled() && steps.bootstrap.outcome == 'success' }}
        # Candidates only accelerate the gate; without an identity it checks everything.
        continue-on-error: true
        # Give the identity and every proof gate the SAME explicit environment.
        # Actions' per-run IDs and file-command paths must not force an otherwise
        # valid cache miss. The gate still hashes its entire actual environment,
        # tools and libraries.
        run: |
          proof_env=(HOME="$HOME" PATH="$PATH" LANG=C.UTF-8
            PYTHONUTF8=1 PYTHONUNBUFFERED=1 TMPDIR="$TMPDIR"
            VOS_BUILD_ROOT="$VOS_BUILD_ROOT" VOS_LANE=
            VOS_ROCQ="$VOS_ROCQ" VOS_ROCQCHK="$VOS_ROCQCHK"
            OPAMROOT="$OPAMROOT" UV_CACHE_DIR="$UV_CACHE_DIR")
          printf '%s\0' "${proof_env[@]}" > "$RUNNER_TEMP/proof-environment"
          identity=$(env -i "${proof_env[@]}" python3 tools/run.py proofs identity)
          if [[ ! "$identity" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::warning::The proof gate printed no context identity: $identity"
            exit 1
          fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      - name: Restore proof cache candidates
        id: proof-cache
        if: ${{ matrix.lane == 'proofs' && !cancelled() && steps.proof-context.outcome == 'success' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GUEST_PROOF_PATHS }}
          # The gate's identity stands for the image, Rocq snapshot and bootstrap: every
          # image whose toolchain and context the gate accepts shares one lineage, and
          # no other context's candidates are offered.
          key: guest-proofs-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.proof-context.outputs.identity }}-${{ hashFiles('proofs/*.v', 'tools/**/*.py', 'tools/pyproject.toml', 'tools/uv.lock', 'docs/requirements-register.md', '.github/workflows/guest-gates.yml') }}
          # Older sources are candidates for the gate's dependency-aware validation.
          restore-keys: guest-proofs-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.proof-context.outputs.identity }}-
          lookup-only: ${{ env.GUEST_COLD == 'true' }}

      - name: Proof gate
        id: proofs
        if: ${{ matrix.lane == 'proofs' && !cancelled() && steps.bootstrap.outcome == 'success' }}
        timeout-minutes: 120
        # Cold and warm proofs run in the explicit environment the identity step fixed.
        run: |
          fresh=()
          if [[ "$GUEST_COLD" == true ]]; then
            fresh=(--fresh)
            echo "Proof policy: fresh compilation, audits and full kernel recheck." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Proof policy: validate native cache candidates; rebuild and recheck anything stale. See proofs.log for actual reuse." >> "$GITHUB_STEP_SUMMARY"
          fi
          mapfile -d '' -t proof_env < "$RUNNER_TEMP/proof-environment"
          /usr/bin/time -f "$GUEST_TIME" env -i "${proof_env[@]}" \
            python3 tools/run.py proofs "${fresh[@]}" \
            2>&1 | tee "$VOS_LOG_DIR/proofs.log"

      - name: Save validated proof cache
        # A rebuilt toolchain may differ byte-for-byte from an existing immutable
        # installation cache. Seed cold proof results only with a new toolchain key.
        if: ${{ github.ref == 'refs/heads/main' && !cancelled() && steps.proofs.outcome == 'success' && steps.proof-cache.outcome == 'success' && steps.proof-cache.outputs.cache-hit != 'true' && (env.GUEST_COLD != 'true' || steps.toolchains.outputs.cache-hit != 'true') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GUEST_PROOF_PATHS }}
          key: ${{ steps.proof-cache.outputs.cache-primary-key }}

      - name: Check generated model bundle
        id: bundle
        if: ${{ matrix.lane == 'model' && !cancelled() && steps.bootstrap.outcome == 'success' }}
        timeout-minutes: 15
        run: |
          /usr/bin/time -f "$GUEST_TIME" python3 tools/run.py model bundle --check \
            2>&1 | tee "$VOS_LOG_DIR/bundle.log"

      - name: Lint standalone RTL
        id: lint
        if: ${{ matrix.lane == 'model' && !cancelled() && steps.bootstrap.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          /usr/bin/time -f "$GUEST_TIME" python3 tools/run.py rtl lint \
            2>&1 | tee "$VOS_LOG_DIR/rtl-lint.log"

      - name: Crosscheck RTL against fresh model vectors
        id: crosscheck
        if: ${{ matrix.lane == 'model' && !cancelled() && steps.bootstrap.outcome == 'success' }}
        timeout-minutes: 30
        run: |
          /usr/bin/time -f "$GUEST_TIME" python3 tools/run.py rtl crosscheck \
            2>&1 | tee "$VOS_LOG_DIR/rtl-crosscheck.log"

      - name: Report guest results
        if: ${{ !cancelled() }}
        env:
          GUEST_LANE: ${{ matrix.lane }}
          # A restored run is not evidence that the toolchains install cold.
          GUEST_TOOLCHAINS: ${{ env.GUEST_COLD != 'true' && steps.toolchains.outputs.cache-hit == 'true' && 'restored' || 'cold' }}
          # A restored memo's verdicts were not discharged again in this run.
          GUEST_SAIL_MEMO: ${{ matrix.lane == 'model' && (env.GUEST_COLD != 'true' && steps.sail-memo.outputs.cache-matched-key != '' && 'restored' || 'cold') || '' }}
          STEP_RESULTS: ${{ toJSON(steps) }}
        run: python3 tools/ci/report_guest.py

      - name: Preserve guest logs and receipts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: guest-${{ matrix.lane }}-${{ env.GUEST_REVISION }}-${{ github.run_attempt }}
          path: ~/verifiedos-guest/logs/
          if-no-files-found: error
          retention-days: 14
