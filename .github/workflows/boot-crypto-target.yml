# SPDX-License-Identifier: Apache-2.0
# M7.1f's complete boot signature target campaign on hosted Linux; see
# firmware/crypto/README.md for its contract. The contained compiler never runs
# here: firmware/crypto/target/ holds its staged streams, bound by their manifest
# to the compiler build and the source bytes. A trusted plan checks revision, timeout
# and strict staging before allocating interface runners. Each interface has its runner,
# which builds the model and executes that interface's positive and refusals; the
# campaign job joins the five shard receipts. Pushes to main that change the staged
# streams or this workflow start it; manual dispatch runs from main, and its optional
# revision input pins checkout to a commit already on main, verified before any
# checked-out code runs. A refused dispatch runs no checked-out code afterwards: each
# later step that runs commands after a failure also requires its job's check not to
# have failed. A push run keeps GitHub's title, the commit subject; a
# dispatched run's title ends with the checked-out revision.

name: boot-crypto-target
# A blank run-name selects GitHub's own title.
run-name: ${{ github.event_name == 'workflow_dispatch' && format('{0}:{1}', github.workflow, inputs.revision || github.sha) || '' }}

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full commit SHA already on main (empty selects current main)
        type: string
        default: ""
      case_timeout:
        description: Seconds each target case may run
        type: number
        default: 9000
  push:
    branches: [main]
    paths:
      - firmware/crypto/target/**
      - .github/workflows/boot-crypto-target.yml

permissions:
  contents: read

concurrency:
  # One campaign at a time: each occupies five runners for hours. A newer run cancels
  # an older one, queued or running, so no runner keeps executing a campaign a later
  # push or dispatch has superseded.
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONUNBUFFERED: "1"
  CAMPAIGN_REVISION: ${{ inputs.revision || github.sha }}
  # Preserve an explicit zero so the trusted plan refuses it.
  CASE_TIMEOUT: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.case_timeout) || '9000' }}
  GUEST_TIME: 'real %e\nuser %U\nsys %S\nmaxrss_kb %M'

defaults:
  run:
    # Explicit bash enables pipefail, so tee cannot hide a failure.
    shell: bash

jobs:
  plan:
    name: boot-crypto-target (plan)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      case_timeout: ${{ steps.timeout.outputs.case_timeout }}
    steps:
      # Validate with the dispatching commit before checking out requested code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Verify dispatched revision belongs to main
        id: dispatch
        shell: python
        env:
          REQUESTED_REVISION: ${{ inputs.revision || github.sha }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_MAIN_SHA: ${{ github.sha }}
        run: |
          import os
          import re
          import subprocess

          revision = os.environ["REQUESTED_REVISION"]
          if os.environ["DISPATCH_REF"] != "refs/heads/main" or not re.fullmatch(r"[0-9a-f]{40}", revision):
              raise SystemExit("Campaign must use main and a full lowercase commit SHA")
          actual = subprocess.check_output(["git", "rev-parse", "--verify", "--end-of-options",
                                            f"{revision}^{{commit}}"], text=True).strip()
          if actual != revision:
              raise SystemExit("Requested revision names no exact commit")
          subprocess.run(["git", "merge-base", "--is-ancestor", revision,
                          os.environ["DISPATCH_MAIN_SHA"]], check=True)

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: tools/pyproject.toml

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version-file: tools/pyproject.toml
          enable-cache: true
          save-cache: false
          cache-suffix: guest-gates
          cache-dependency-glob: |
            tools/pyproject.toml
            tools/uv.lock

      - name: Validate and normalize the case timeout
        id: timeout
        # This helper belongs to the dispatching commit; older requested revisions
        # need only the stream verifier they already own, not this new helper.
        run: |
          uv run --project tools --locked --exact --no-python-downloads \
            python tools/ci/boot_crypto_plan.py --timeout-only \
            --timeout "$CASE_TIMEOUT" --github-output "$GITHUB_OUTPUT"

      - name: Check out the planned revision
        shell: python
        env:
          REQUESTED_REVISION: ${{ inputs.revision || github.sha }}
        run: |
          import os
          import subprocess

          subprocess.run(["git", "checkout", "--detach", os.environ["REQUESTED_REVISION"]], check=True)

      - name: Verify campaign readiness
        id: ready
        # The requested revision's strict acceptance command owns its staged inputs.
        run: python tools/run.py boot-crypto verify

  interface:
    name: boot-crypto-target (${{ matrix.mode }})
    needs: plan
    env:
      CASE_TIMEOUT: ${{ needs.plan.outputs.case_timeout }}
    runs-on: ubuntu-26.04
    # Two phases of at most one case timeout each, after bootstrap and the model build.
    timeout-minutes: 355
    strategy:
      # Every interface keeps its own verdict when another fails.
      fail-fast: false
      matrix:
        mode: [slh, slh-internal, mldsa, mldsa-internal, mldsa-mu]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Verify dispatched revision belongs to main
        id: dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: python
        env:
          REQUESTED_REVISION: ${{ inputs.revision || github.sha }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_MAIN_SHA: ${{ github.sha }}
        run: |
          import os
          import re
          import subprocess

          revision = os.environ["REQUESTED_REVISION"]
          if os.environ["DISPATCH_REF"] != "refs/heads/main" or not re.fullmatch(r"[0-9a-f]{40}", revision):
              raise SystemExit("Dispatch must use main and a full lowercase commit SHA")
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if actual != revision:
              raise SystemExit("Checkout does not match the requested revision")
          subprocess.run(["git", "merge-base", "--is-ancestor", revision,
                          os.environ["DISPATCH_MAIN_SHA"]], check=True)

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: tools/pyproject.toml

      # run.py enters the locked tool environment for every command, so uv comes first.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version-file: tools/pyproject.toml
          enable-cache: true
          # Guest CI owns the saved caches this workflow reads, under its own suffix.
          save-cache: false
          cache-suffix: guest-gates
          cache-dependency-glob: |
            tools/pyproject.toml
            tools/uv.lock

      - name: Verify the staged streams and the case timeout
        # Stale or altered streams refuse before any runner time is spent on them. Two
        # phases of one case timeout each must fit the execution step's 320 minutes.
        run: |
          if ! [[ "$CASE_TIMEOUT" =~ ^[0-9]+$ ]] || (( CASE_TIMEOUT < 1 || CASE_TIMEOUT > 9600 )); then
            echo "::error::case_timeout must be a whole number of seconds from 1 to 9600"
            exit 1
          fi
          python3 tools/run.py boot-crypto verify

      - name: Check out the trusted target setup action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .target-ci
          sparse-checkout: .github/actions/setup-target-sail
          persist-credentials: false
          submodules: false

      # The reviewed actionlint cannot parse $/; K-118 verifies this dispatch checkout.
      - name: Set up the target Sail toolchain # zizmor: ignore[self-repository]
        # The dispatching commit owns the action, including for older pinned revisions.
        # Its commands use this runner's verified requested checkout.
        uses: ./.target-ci/.github/actions/setup-target-sail
        timeout-minutes: 125

      - name: Build the model
        timeout-minutes: 60
        run: |
          /usr/bin/time -f "$GUEST_TIME" python3 tools/run.py model build \
            2>&1 | tee "$VOS_LOG_DIR/model-build-console.log"

      - name: Execute the interface
        timeout-minutes: 320
        env:
          MODE: ${{ matrix.mode }}
        run: |
          /usr/bin/time -f "$GUEST_TIME" python3 tools/run.py boot-crypto target --staged \
            --mode "$MODE" --jobs 4 --timeout "$CASE_TIMEOUT" \
            --simulator "$VOS_BUILD_DIR/c_emulator/sail_riscv_sim" \
            --build-receipt "$VOS_LOG_DIR/model-build.json" \
            --out "$VOS_BUILD_ROOT/boot-crypto-target" \
            2>&1 | tee "$VOS_LOG_DIR/boot-crypto-target.log"

      - name: Preserve the interface receipt and logs
        # always(): a job that reaches its time limit still keeps its progress and logs.
        # The pinned action runs no checked-out code; after a refused dispatch no step
        # has written these paths, so it finds no files and uploads nothing.
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # One name per interface and revision; a rerun of a failed interface replaces it.
          name: boot-crypto-shard-${{ matrix.mode }}-${{ env.CAMPAIGN_REVISION }}
          path: |
            ~/verifiedos-guest/build/boot-crypto-target/report.json
            ~/verifiedos-guest/build/boot-crypto-target/progress.json
            ~/verifiedos-guest/build/boot-crypto-target/*/target.log
            ~/verifiedos-guest/logs/
          # A shard refused before bootstrap has nothing to keep; the join names it.
          if-no-files-found: warn
          overwrite: true
          retention-days: 30

  campaign:
    name: boot-crypto-target
    needs: [plan, interface]
    # A shard that failed still leaves its receipt; the join records or refuses it.
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Verify dispatched revision belongs to main
        id: dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: python
        env:
          REQUESTED_REVISION: ${{ inputs.revision || github.sha }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_MAIN_SHA: ${{ github.sha }}
        run: |
          import os
          import re
          import subprocess

          revision = os.environ["REQUESTED_REVISION"]
          if os.environ["DISPATCH_REF"] != "refs/heads/main" or not re.fullmatch(r"[0-9a-f]{40}", revision):
              raise SystemExit("Dispatch must use main and a full lowercase commit SHA")
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if actual != revision:
              raise SystemExit("Checkout does not match the requested revision")
          subprocess.run(["git", "merge-base", "--is-ancestor", revision,
                          os.environ["DISPATCH_MAIN_SHA"]], check=True)

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: tools/pyproject.toml

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version-file: tools/pyproject.toml
          enable-cache: true
          save-cache: false
          cache-suffix: guest-gates
          cache-dependency-glob: |
            tools/pyproject.toml
            tools/uv.lock

      - name: Collect the interface receipts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: boot-crypto-shard-*-${{ env.CAMPAIGN_REVISION }}
          path: ${{ runner.temp }}/shards

      - name: Join the campaign
        run: |
          shopt -s nullglob
          reports=("$RUNNER_TEMP"/shards/*/build/boot-crypto-target/report.json)
          python3 tools/run.py boot-crypto join --out "$RUNNER_TEMP/campaign" "${reports[@]}"

      - name: Report the campaign
        if: ${{ !cancelled() && steps.dispatch.outcome != 'failure' }}
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          report = Path(os.environ["RUNNER_TEMP"]) / "campaign" / "report.json"
          data = json.loads(report.read_text(encoding="utf-8")) if report.is_file() else {"error": "no joined report"}
          lines = [f"### Boot signature target campaign: {data.get('status', 'failed')}", ""]
          if "error" in data:
              lines.append(f"Refused: {data['error']}")
          else:
              lines += ["| Case | Interface | Verdict | Seconds | Passed |", "| --- | --- | --- | --- | --- |"]
              lines += [f"| `{row['case']}` | {row['mode']} | {row['diagnostic']} | {row['seconds']} | {row['passed']} |"
                        for row in data["cases"]]
              if data["unexecuted_cases"]:
                  lines.append(f"\nUnexecuted: {', '.join(data['unexecuted_cases'])}")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")

      - name: Preserve the campaign receipt
        # The pinned action runs no checked-out code; after a refused dispatch the join
        # has not run, so it finds no receipt and uploads nothing.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boot-crypto-campaign-${{ env.CAMPAIGN_REVISION }}
          path: ${{ runner.temp }}/campaign/report.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30
