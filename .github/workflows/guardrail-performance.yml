# SPDX-License-Identifier: Apache-2.0
# Equivalent-work comparisons only. This route supplies no Host or Guest CI verdict.
name: guardrail-performance
run-name: ${{ format('guardrail-performance:{0}', inputs.revision || github.sha) }}
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full commit already on main (empty selects dispatch SHA)
        type: string
        default: ""
      performance_base:
        description: Full proper main ancestor holding the baseline tools
        type: string
        required: true
      census:
        description: Include native census replay (requires complete retained control inputs)
        type: boolean
        default: false
      profile_only:
        description: Capture checker call costs only, without paired timing or other comparisons
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false
env:
  PYTHONUTF8: "1"
  PYTHONUNBUFFERED: "1"
jobs:
  compare:
    name: guardrail comparison (${{ matrix.scope }})
    runs-on: ubuntu-26.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        scope: [checker, runner, proof-identity, census]
        exclude:
          - scope: ${{ inputs.census && !inputs.profile_only && 'none' || 'census' }}
          - scope: ${{ inputs.profile_only && 'runner' || 'none' }}
          - scope: ${{ inputs.profile_only && 'proof-identity' || 'none' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Verify requested inputs belong to main
        id: dispatch
        shell: python
        env:
          REQUESTED_REVISION: ${{ inputs.revision || github.sha }}
          PERFORMANCE_BASE: ${{ inputs.performance_base }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_MAIN_SHA: ${{ github.sha }}
        run: |
          import os
          import re
          import subprocess
          revision = os.environ['REQUESTED_REVISION']
          base = os.environ['PERFORMANCE_BASE']
          if (os.environ['DISPATCH_REF'] != 'refs/heads/main'
                  or re.fullmatch(r'[0-9a-f]{40}', revision) is None
                  or re.fullmatch(r'[0-9a-f]{40}', base) is None or base == revision):
              raise SystemExit('Require main, a full revision and its proper full ancestor')
          if subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() != revision:
              raise SystemExit('Checkout differs from requested revision')
          subprocess.run(['git', 'merge-base', '--is-ancestor', revision,
                          os.environ['DISPATCH_MAIN_SHA']], check=True)
          subprocess.run(['git', 'merge-base', '--is-ancestor', base, revision], check=True)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: tools/pyproject.toml
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: tools/pyproject.toml
          enable-cache: true
          save-cache: false
          cache-suffix: host-gates
          cache-dependency-glob: |
            tools/pyproject.toml
            tools/uv.lock
      - name: Identify proof toolchain recipe
        id: recipe
        if: ${{ matrix.scope == 'proof-identity' }}
        shell: bash
        run: |
          identity=$(python3 tools/ci/bootstrap_guest.py --print-recipe-identity --toolchain rocq)
          [[ "$identity" =~ ^[0-9a-f]{64}$ ]] || exit 1
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Restore proof toolchain candidate
        if: ${{ matrix.scope == 'proof-identity' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/verifiedos-guest/.verifiedos-guest-root
            ~/verifiedos-guest/opam
            !~/verifiedos-guest/opam/download-cache
            !~/verifiedos-guest/opam/log
            ~/verifiedos-guest/build/toolchains
          key: guest-toolchains-v1-proofs-${{ runner.os }}-${{ runner.arch }}-${{ steps.recipe.outputs.image }}-${{ steps.recipe.outputs.identity }}
      - name: Probe or install the locked proof toolchain
        if: ${{ matrix.scope == 'proof-identity' }}
        timeout-minutes: 120
        shell: bash
        run: |
          python3 tools/ci/bootstrap_guest.py --root "$HOME/verifiedos-guest" \
            --toolchain rocq --install-system --github-env "$GITHUB_ENV" --github-path "$GITHUB_PATH"
      - name: Compare complete checker reports
        if: ${{ matrix.scope == 'checker' && !inputs.profile_only }}
        timeout-minutes: 60
        shell: bash
        env:
          PERFORMANCE_BASE: ${{ inputs.performance_base }}
          UV_PROJECT_ENVIRONMENT: out/venv-linux
        run: |
          uv run --project tools --locked --exact --no-python-downloads python \
            tools/ci/archive_scan_benchmark.py --base "$PERFORMANCE_BASE" \
            --output "$RUNNER_TEMP/performance/checker.json"
      - name: Capture checker call costs separately
        if: ${{ matrix.scope == 'checker' }}
        timeout-minutes: 60
        shell: bash
        env:
          UV_PROJECT_ENVIRONMENT: out/venv-linux
        run: |
          mkdir -p "$RUNNER_TEMP/performance"
          uv run --project tools --locked --exact --no-python-downloads python \
            -m cProfile -o "$RUNNER_TEMP/performance/checker.prof" \
            tools/ci/archive_scan_benchmark.py --worker-tools "$PWD/tools" --root "$PWD" \
            --output "$RUNNER_TEMP/performance/profiled-checker.json"
      - name: Compare complete Markdown and repair work
        if: ${{ matrix.scope == 'runner' }}
        timeout-minutes: 120
        shell: bash
        env:
          PERFORMANCE_BASE: ${{ inputs.performance_base }}
          UV_PROJECT_ENVIRONMENT: out/venv-linux
        run: |
          uv run --project tools --locked --exact --no-python-downloads python \
            tools/ci/runner_benchmark.py --base "$PERFORMANCE_BASE" \
            --output "$RUNNER_TEMP/performance/runner.json"
      - name: Compare installed proof identities and run native controls
        if: ${{ matrix.scope == 'proof-identity' }}
        timeout-minutes: 60
        shell: bash
        env:
          PERFORMANCE_BASE: ${{ inputs.performance_base }}
        run: |
          python3 tools/run.py test --only proofcache --jobs 1
          uv run --project tools --locked --exact --no-python-downloads python \
            tools/ci/proof_identity_benchmark.py --base "$PERFORMANCE_BASE" \
            --output "$RUNNER_TEMP/performance/proof-identity.json"
      - name: Compare complete native census replay
        if: ${{ matrix.scope == 'census' }}
        timeout-minutes: 330
        shell: bash
        env:
          PERFORMANCE_BASE: ${{ inputs.performance_base }}
          UV_PROJECT_ENVIRONMENT: out/venv-linux
        run: |
          uv run --project tools --locked --exact --no-python-downloads python \
            tools/ci/census_benchmark.py --base "$PERFORMANCE_BASE" \
            --output "$RUNNER_TEMP/performance/census.json"
      - name: Retain measurements or partial failure evidence
        if: ${{ !cancelled() && steps.dispatch.outcome != 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guardrail-performance-${{ matrix.scope }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/performance/
          if-no-files-found: warn
          retention-days: 14
