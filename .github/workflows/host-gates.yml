# SPDX-License-Identifier: Apache-2.0
# Read-only host validation on Windows and Ubuntu. Sail, Rocq and Verilator
# evidence runs in guest-gates.yml; see tools/README.md for the gate contracts.
# Manual dispatch runs from main; its optional revision input pins checkout to a
# commit already on main, verified before any checked-out code runs. A refused
# dispatch runs no checked-out code afterwards: each later step that runs commands
# after a failure also requires that check not to have failed. Push and pull
# request runs keep GitHub's title: the commit subject or pull request title. A
# dispatched run's title follows the workflow name with the title input, which
# fanout fills with the commit subject, or else with the checked-out revision.
#
# Shards partition mutation cases and behavioral test modules: four on Ubuntu and
# eight on Windows, whose CPU-bound shards run the same work more slowly. Shard 1
# also runs the checker, typecheck and mutation repair path, Ubuntu's shard 1
# analyzes the workflows with zizmor and actionlint, and Ubuntu's last shard runs the
# curated model's pre-commit hooks. All shards must pass.
# uv installs locked dependencies into a checkout-local environment;
# only downloads are cached. K-67 checks dependency pins; K-75 checks the Python floor.
#
# Per-member JSON in runner.temp supplies failure annotations and the job summary.
# Reporting is diagnostic; the gate, workflow-analysis and model-hook steps own the
# job's verdict.

name: host-gates
# A blank run-name selects GitHub's own title.
run-name: ${{ github.event_name == 'workflow_dispatch' && format('{0}:{1}', github.workflow, inputs.title || inputs.revision || github.sha) || '' }}

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full commit SHA already on main (empty selects current main)
        type: string
        default: ""
      title:
        description: Optional run title text after the workflow name (empty shows the revision)
        type: string
        default: ""
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Superseded PR runs are disposable; every push to main keeps its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUTF8: "1"
  VERDICT_FILE: host-gates-verdict.json

jobs:
  host-gates-shard:
    name: host-gates (${{ matrix.platform }}, shard ${{ matrix.shard }}/${{ matrix.shards }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [Ubuntu, Windows]
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
        exclude:
          - {platform: Ubuntu, shard: 5}
          - {platform: Ubuntu, shard: 6}
          - {platform: Ubuntu, shard: 7}
          - {platform: Ubuntu, shard: 8}
        # Each include adds its platform's image label and partition count to that
        # platform's combinations. Explicit labels make an image move a reviewed edit;
        # the job names carry the platform alone, so moving an image renames nothing.
        include:
          - {platform: Ubuntu, runner: ubuntu-26.04, shards: 4}
          - {platform: Windows, runner: windows-2025-vs2026, shards: 8}
    steps:
      # Windows images keep the checkout and runner.temp on D: but TEMP on the slower
      # C: drive; selftest sandboxes and test scratch trees follow TMP and TEMP.
      - name: Keep temporary files on the checkout drive
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          # A dispatch's check below reads main's history; push and pull request runs
          # read only the checked-out commit, so they fetch it alone. The dispatch arm
          # is the string '0' because a bare 0 is falsy and would select the other arm.
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && '0' || '1' }}
          persist-credentials: false
          # The checker reads gitlinks from the index; submodule sources are unnecessary.
          submodules: false

      - name: Verify dispatched revision belongs to main
        id: dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: python
        env:
          REQUESTED_REVISION: ${{ inputs.revision || github.sha }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_MAIN_SHA: ${{ github.sha }}
        run: |
          import os
          import re
          import subprocess

          revision = os.environ["REQUESTED_REVISION"]
          if os.environ["DISPATCH_REF"] != "refs/heads/main" or not re.fullmatch(r"[0-9a-f]{40}", revision):
              raise SystemExit("Dispatch must use main and a full lowercase commit SHA")
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if actual != revision:
              raise SystemExit("Checkout does not match the requested revision")
          subprocess.run(["git", "merge-base", "--is-ancestor", revision,
                          os.environ["DISPATCH_MAIN_SHA"]], check=True)

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version-file: tools/pyproject.toml
          enable-cache: true
          # PRs reuse main's downloads without uploading a cache for each merge ref.
          save-cache: ${{ github.event_name == 'push' && matrix.shard == 1 }}
          # The key names the runner image but no workflow; the suffix keeps Guest
          # CI's larger download set and this one apart on a shared image.
          cache-suffix: host-gates
          cache-dependency-glob: |
            tools/pyproject.toml
            tools/uv.lock

      # Each platform's native shell runs the gate, PowerShell on Windows and bash on
      # Ubuntu, as a developer there runs it; Git Bash would put its own tools ahead of
      # the runner's PATH for the whole Windows suite. Both read the shard and the
      # verdict path from the environment rather than from expressions in the body.
      - name: Host gates and behavioral tests (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
        run: python tools/run.py --check --tests --shard "$env:SHARD/$env:SHARDS" --summary "$env:RUNNER_TEMP/$env:VERDICT_FILE"

      - name: Host gates and behavioral tests (Ubuntu)
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
        run: python tools/run.py --check --tests --shard "$SHARD/$SHARDS" --summary "$RUNNER_TEMP/$VERDICT_FILE"

      # The analyzers read only the checked-out workflow files, so one runner decides
      # them. zizmor is locked in tools/uv.lock's workflows group, outside the gate's
      # environment; actionlint.sh verifies its pinned release archive. No pinned
      # shellcheck or pyflakes is provisioned, so actionlint runs without either.
      - name: Analyze workflows
        if: ${{ !cancelled() && steps.dispatch.outcome != 'failure' && matrix.platform == 'Ubuntu' && matrix.shard == 1 }}
        shell: bash
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/venv-workflows
          ACTIONLINT_ROOT: ${{ runner.temp }}/toolchains
        run: |
          status=0
          uv run --project tools --locked --exact --only-group workflows --no-python-downloads \
            zizmor --offline .github/workflows || status=1
          sh tools/ci/actionlint.sh -shellcheck= -pyflakes= || status=1
          exit "$status"

      # The curated model's pre-commit hooks, as model/.pre-commit-config.yaml pins them
      # by commit, run over model/ with the pre-commit tools/uv.lock's model group locks,
      # in an environment of their own; any finding or rewrite fails the job.
      # markdown-link-check is skipped because it fetches every external link the
      # model's Markdown names. pip installs each Python hook's dependencies at the
      # releases tools/ci/model-hooks-constraints.txt fixes and builds its package with
      # the hashed backends tools/ci/model-hooks-build-constraints.txt fixes, both named
      # by absolute path because pip runs in each hook's clone, and admits no file
      # uploaded within three days; a private app-data directory keeps each
      # environment's pip the one the locked virtualenv embeds. prettier installs from
      # npm on the runner's Node.js. The step runs on the last shard so that shard 1,
      # which also runs the checker, typecheck, repair path and workflow analysis, does
      # not lengthen.
      - name: Model hooks
        if: ${{ !cancelled() && steps.dispatch.outcome != 'failure' && matrix.platform == 'Ubuntu' && matrix.shard == matrix.shards }}
        shell: bash
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/venv-model
          PRE_COMMIT_HOME: ${{ runner.temp }}/pre-commit
          VIRTUALENV_OVERRIDE_APP_DATA: ${{ runner.temp }}/virtualenv
          PIP_CONSTRAINT: ${{ github.workspace }}/tools/ci/model-hooks-constraints.txt
          PIP_BUILD_CONSTRAINT: ${{ github.workspace }}/tools/ci/model-hooks-build-constraints.txt
          PIP_UPLOADED_PRIOR_TO: P3D
          SKIP: markdown-link-check
        run: |
          uv run --project tools --locked --exact --only-group model --no-python-downloads \
            pre-commit run --config model/.pre-commit-config.yaml --all-files \
            --show-diff-on-failure --color=always

      - name: Report gate results
        if: ${{ !cancelled() && steps.dispatch.outcome != 'failure' }}
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          def annotate(level: str, message: str) -> None:
              message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::{level} title=host-gates::{message}")

          try:
              verdict = Path(os.environ["RUNNER_TEMP"]) / os.environ["VERDICT_FILE"]
              report = json.loads(verdict.read_text(encoding="utf-8")) if verdict.is_file() else {
                  "stopped": "No verdict file was written; the gate never started or did not finish. See earlier steps.",
                  "members": [],
              }
              rows = ["| Member | Seconds | Exit | Verdict |", "| --- | --- | --- | --- |"]
              if stopped := report.get("stopped"):
                  annotate("error", stopped)
                  rows.append(f"| n/a | n/a | n/a | {stopped} |")
              for member in report["members"]:
                  state = "clean" if member["clean"] else (
                      "reported findings" if member["reached_verdict"] else "never reached a verdict")
                  rows.append(f"| `{member['name']}` | {member['elapsed_seconds']:.2f} | "
                              f"{member['code']} | {state} |")
                  if not member["clean"]:
                      annotate("error", f"{member['name']}: {state} (exit {member['code']}); "
                               f"it decides {member['decides']}. See the gate log.")
              with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
                  if report["members"]:
                      annotate("notice", "Timings: " + "; ".join(
                          f"{m['name']}: {m['elapsed_seconds']:.2f}s" for m in report["members"]))
                  # The parts members measured inside themselves: test modules, selftest
                  # phases and cases. They overlap like members; the slowest show where
                  # a shard's time went.
                  slowest = sorted(((u["seconds"], u["kind"], u["name"])
                                    for m in report["members"] for u in m.get("units") or []),
                                   reverse=True)[:10]
                  units = "; ".join(f"{kind} {name}: {seconds:.2f}s"
                                    for seconds, kind, name in slowest)
                  if units:
                      annotate("notice", "Slowest units: " + units)
                  shard = report.get("shard", {})
                  label = f"shard {shard.get('index', '?')}/{shard.get('total', '?')}"
                  summary.write(f"### Host gates: {label}\n\nAll shards must pass.\n\n"
                                + "\n".join(rows) + "\n"
                                + (f"\nSlowest units: {units}\n" if units else ""))
          except Exception as err:
              # Reporting is diagnostic; the gate, workflow-analysis and model-hook
              # steps own the job's verdict.
              annotate("warning", f"Could not render gate results: {err!r}")

  # fanout_ci.HOST_JOBS in tools/vos/fanout_ci.py owns these job names; renaming one
  # changes the evidence fanout accepts. No repository ruleset requires them. A failed,
  # skipped or cancelled shard cannot leave a successful aggregate, even if its peers
  # completed successfully. The aggregates check out nothing and only read the shards'
  # result, so they take the generally available ubuntu-24.04 image rather than the
  # shards' preview image, whose queue has held them over a minute past the last shard.
  host-gates:
    name: host-gates (${{ matrix.platform }})
    needs: host-gates-shard
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    strategy:
      matrix:
        platform: [Ubuntu, Windows]
    steps:
      - name: Require every shard on both operating systems
        env:
          SHARDS_RESULT: ${{ needs.host-gates-shard.result }}
        run: test "$SHARDS_RESULT" = success
