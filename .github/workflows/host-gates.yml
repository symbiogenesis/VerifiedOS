# SPDX-License-Identifier: Apache-2.0
#
# The host gate wave, run on a clone at every push and pull request to main.
#
# `python tools/run.py` is the three host gates (check, selftest, typecheck) as one
# run and one exit code, and `python tools/run.py test` is the tools' own tests. All
# of it is pure Python over the checkout, so it runs on a stock Ubuntu runner with no
# toolchain: what needs Sail, Rocq or Verilator is the guest lane, which run.py
# re-launches inside WSL on a developer's machine and which nothing here reaches. A
# green run here is a witness that the host gates passed on this commit, never a
# substitute for the guest evidence a completion note quotes.
#
# The checker's corpus is the git index, and the upstream/ entries it reads are
# gitlinks, so the checkout deliberately initializes no submodule: an empty upstream/
# directory is the tree the checker is written for. The interpreter floor and the two
# checker pins below are not copies anybody has to remember: K-75 reads the
# python-version here against tools/ty.toml and K-67 reads each install line against
# tools/vos/cli/typecheck.py, so a bump taken in one place and not the other is a
# finding on the next run. The runner label, the action references and the bootstrap
# route are the three classes this file states that no rule owns, which finding F-198b
# carries. Every action here runs on node24, the runtime the runner now forces a node20
# action onto with a deprecation warning; two are named by their floating major tag and
# setup-uv by a whole version, because astral-sh stopped publishing major and minor tags
# at v8, so its bump is a version and not a major. The uv it installs is named too,
# rather than left to the fallback the action takes when it can read no required-version
# off a uv.toml or a pyproject: the version stated is the one the developer lane runs,
# so an installer difference between the two lanes is a bump taken here and not a
# silent drift. Nothing holds it, that being the action-reference class again. Its
# cache is turned off rather than
# left on its default, which is on for a hosted runner: nothing here is resolved from a
# dependency file, there being no lockfile, requirements file or pyproject in the tree,
# so the key the action derives is constant and the entry it saves would never be
# invalidated. The three installs below name exact versions instead, which is the
# property a cache key would have been standing in for. jsonschema is the one third-party
# import the tools make, installed the way tools/README.md spells it for the host. On
# Linux, run.py makes no WSL hop: the hop is taken only on win32, and the wave's
# members are host commands regardless. PYTHONUTF8 is set so that a redirected stream
# on the runner reads and writes the corpus's encoding, which is what run.py
# reconfigures on its own streams and cannot reach in a member's.
#
# What the test step witnesses is narrower than its name: tools/vos/cli/test.py
# reads the lane off sys.platform, so on this runner the cases marked host are
# skipped and the lane-neutral cases run beside the guest slice, whose one case
# holds provision --check to answering the same twice over an unmoved tree.

name: host-gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  host-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the tree, gitlinks and no submodule
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set up Python at the floor tools/README.md states
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.5"
          enable-cache: false

      - name: Install the pinned checkers as uv tools
        run: |
          uv tool install ty==0.0.75
          uv tool install ruff==0.16.5

      - name: Install jsonschema
        run: uv pip install --system jsonschema

      - name: Host gate wave
        run: python tools/run.py

      - name: Tools' own tests
        run: python tools/run.py test
