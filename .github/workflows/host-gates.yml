# SPDX-License-Identifier: Apache-2.0
# Read-only host validation on Windows and Ubuntu. Sail, Rocq and Verilator
# evidence runs in guest-gates.yml; see tools/README.md for the gate contracts.
# Manual dispatch runs from main; its optional revision input pins checkout to a
# commit already on main, verified before any checked-out code runs. Push and pull
# request runs keep GitHub's title: the commit subject or pull request title. A
# dispatched run's title follows its identity prefix with the title input, which
# fanout fills with the commit subject, or else with the checked-out revision.
#
# Four shards per OS partition mutation cases and behavioral test modules. Shard 1
# also runs the checker, typecheck and mutation repair path. All shards must pass.
# uv installs locked dependencies into a checkout-local environment;
# only downloads are cached. K-67 checks dependency pins; K-75 checks the Python floor.
#
# Per-member JSON in runner.temp supplies failure annotations and the job summary.
# Reporting is diagnostic; the gate step owns the job's verdict.

name: host-gates
# A blank run-name selects GitHub's own title.
run-name: ${{ github.event_name == 'workflow_dispatch' && format('{0}:{1}', inputs.fanout_token && format('fanout:{0}', inputs.fanout_token) || github.workflow, inputs.title || inputs.revision || github.sha) || '' }}

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full commit SHA already on main (empty selects current main)
        type: string
        default: ""
      fanout_token:
        description: Optional fan-out dispatch identity for interrupted handoff recovery
        type: string
        default: ""
      title:
        description: Optional run title text after the prefix (empty shows the revision)
        type: string
        default: ""
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Superseded PR runs are disposable; every push to main keeps its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUTF8: "1"
  VERDICT_FILE: host-gates-verdict.json

jobs:
  host-gates-shard:
    name: host-gates (${{ matrix.os }}, shard ${{ matrix.shard }}/4)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          # The checker reads gitlinks from the index; submodule sources are unnecessary.
          submodules: false

      - name: Verify dispatched revision belongs to main
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: python
        env:
          REQUESTED_REVISION: ${{ inputs.revision || github.sha }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_MAIN_SHA: ${{ github.sha }}
        run: |
          import os
          import re
          import subprocess

          revision = os.environ["REQUESTED_REVISION"]
          if os.environ["DISPATCH_REF"] != "refs/heads/main" or not re.fullmatch(r"[0-9a-f]{40}", revision):
              raise SystemExit("Dispatch must use main and a full lowercase commit SHA")
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if actual != revision:
              raise SystemExit("Checkout does not match the requested revision")
          subprocess.run(["git", "merge-base", "--is-ancestor", revision,
                          os.environ["DISPATCH_MAIN_SHA"]], check=True)

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version-file: tools/pyproject.toml
          enable-cache: true
          # PRs reuse main's downloads without uploading a cache for each merge ref.
          save-cache: ${{ github.event_name == 'push' && matrix.shard == 1 }}
          cache-dependency-glob: |
            tools/pyproject.toml
            tools/uv.lock

      - name: Host gates and behavioral tests
        run: python tools/run.py --check --tests --shard ${{ matrix.shard }}/4 --summary "${{ runner.temp }}/${{ env.VERDICT_FILE }}"

      - name: Report gate results
        if: ${{ !cancelled() }}
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          def annotate(level: str, message: str) -> None:
              message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::{level} title=host-gates::{message}")

          try:
              verdict = Path(os.environ["RUNNER_TEMP"]) / os.environ["VERDICT_FILE"]
              report = json.loads(verdict.read_text(encoding="utf-8")) if verdict.is_file() else {
                  "stopped": "No verdict file was written; the gate never started or did not finish. See earlier steps.",
                  "members": [],
              }
              rows = ["| Member | Seconds | Exit | Verdict |", "| --- | --- | --- | --- |"]
              if stopped := report.get("stopped"):
                  annotate("error", stopped)
                  rows.append(f"| n/a | n/a | n/a | {stopped} |")
              for member in report["members"]:
                  state = "clean" if member["clean"] else (
                      "reported findings" if member["reached_verdict"] else "never reached a verdict")
                  rows.append(f"| `{member['name']}` | {member['elapsed_seconds']:.2f} | "
                              f"{member['code']} | {state} |")
                  if not member["clean"]:
                      annotate("error", f"{member['name']}: {state} (exit {member['code']}); "
                               f"it decides {member['decides']}. See the gate log.")
              with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
                  if report["members"]:
                      annotate("notice", "Timings: " + "; ".join(
                          f"{m['name']}: {m['elapsed_seconds']:.2f}s" for m in report["members"]))
                  shard = report.get("shard", {})
                  label = f"shard {shard.get('index', '?')}/{shard.get('total', '?')}"
                  summary.write(f"### Host gates: {label}\n\nAll shards must pass.\n\n"
                                + "\n".join(rows) + "\n")
          except Exception as err:
              # Reporting is diagnostic; the gate step owns the job's verdict.
              annotate("warning", f"Could not render gate results: {err!r}")

  # Keep the existing required-check names. A failed, skipped or cancelled shard
  # cannot leave a successful aggregate, even if its peers completed successfully.
  host-gates:
    name: host-gates (${{ matrix.os }})
    needs: host-gates-shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Require every shard on both operating systems
        env:
          SHARDS_RESULT: ${{ needs.host-gates-shard.result }}
        run: test "$SHARDS_RESULT" = success
