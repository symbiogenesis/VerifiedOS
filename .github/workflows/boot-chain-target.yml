        # always(): a job that reaches its time limit still keeps its progress and logs.
        # The pinned action runs no checked-out code; after a refused dispatch no step
        # has written these paths, so it finds no files and uploads nothing.
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: boot-chain-shard-main-die-${{ env.CAMPAIGN_REVISION }}
          path: |
            ~/verifiedos-guest/build/boot-chain-target/report.json
            ~/verifiedos-guest/build/boot-chain-target/progress.json
            ~/verifiedos-guest/build/boot-chain-target/*/*.log
            ~/verifiedos-guest/logs/
          if-no-files-found: warn
          overwrite: true
          retention-days: 30

  watchdog:
    name: boot-chain-target (watchdog)
    runs-on: ubuntu-26.04
    # Three runtime-only runs at once, after bootstrap and the model build.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Verify dispatched revision belongs to main
        id: dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: python
        env:
          REQUESTED_REVISION: ${{ inputs.revision || github.sha }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_MAIN_SHA: ${{ github.sha }}
        run: |
          import os
          import re
          import subprocess

          revision = os.environ["REQUESTED_REVISION"]
          if os.environ["DISPATCH_REF"] != "refs/heads/main" or not re.fullmatch(r"[0-9a-f]{40}", revision):
              raise SystemExit("Dispatch must use main and a full lowercase commit SHA")
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if actual != revision:
              raise SystemExit("Checkout does not match the requested revision")
          subprocess.run(["git", "merge-base", "--is-ancestor", revision,
                          os.environ["DISPATCH_MAIN_SHA"]], check=True)

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version-file: tools/pyproject.toml
          enable-cache: true
          save-cache: false
          cache-suffix: guest-gates
          cache-dependency-glob: |
            tools/pyproject.toml
            tools/uv.lock

      - name: Verify the staged chain and the case timeout
        run: |
          if ! [[ "$CASE_TIMEOUT" =~ ^[0-9]+$ ]] || (( CASE_TIMEOUT < 1 || CASE_TIMEOUT > 12000 )); then
            echo "::error::case_timeout must be a whole number of seconds from 1 to 12000"
            exit 1
          fi
          python3 tools/run.py boot-handoff chain-verify

      - name: Identify the runner image
        id: image
        run: echo "version=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Identify the toolchain recipe
        id: recipe
        run: |
          identity=$(python3 tools/ci/bootstrap_guest.py --print-recipe-identity \
            --toolchain sail --toolchain rtl)
          if [[ ! "$identity" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::bootstrap printed no toolchain recipe identity: $identity"
            exit 1
          fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      - name: Restore installed toolchains
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/verifiedos-guest/.verifiedos-guest-root
            ~/verifiedos-guest/opam
            !~/verifiedos-guest/opam/download-cache
            !~/verifiedos-guest/opam/log
            ~/verifiedos-guest/build/toolchains
          key: guest-toolchains-v1-model-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.version }}-${{ steps.recipe.outputs.identity }}

      - name: Bootstrap the Sail toolchain
        id: bootstrap
        timeout-minutes: 120
        run: |
          /usr/bin/time -f "$GUEST_TIME" python3 tools/ci/bootstrap_guest.py \
            --root "$HOME/verifiedos-guest" --install-system --toolchain sail \
            --github-env "$GITHUB_ENV" --github-path "$GITHUB_PATH" \
            2>&1 | tee "$RUNNER_TEMP/guest-bootstrap-console.log"

      - name: Identify the Sail solver
        id: solver
        continue-on-error: true
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json
          import os
          from pathlib import Path

          record = json.loads((Path(os.environ["VOS_LOG_DIR"]) / "bootstrap.json").read_text(encoding="utf-8"))
          print(f"identity=sail-{record['sail']}-z3-{record['z3']}-{record['snapshots']['sail'][:16]}")
          PY

      - name: Restore the Sail memo
        if: ${{ steps.solver.outcome == 'success' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VOS_BUILD_DIR }}/model/sail_smt_cache
          key: guest-sail-memo-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.version }}-${{ steps.solver.outputs.identity }}-${{ hashFiles('model/model/**') }}
          restore-keys: guest-sail-memo-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.version }}-${{ steps.solver.outputs.identity }}-

      - name: Build the model
        timeout-minutes: 60
        run: |
          /usr/bin/time -f "$GUEST_TIME" python3 tools/run.py model build \
            2>&1 | tee "$VOS_LOG_DIR/model-build-console.log"

      - name: Execute the watchdog group
        timeout-minutes: 50
        run: |
          /usr/bin/time -f "$GUEST_TIME" python3 tools/run.py boot-handoff chain-target --staged \
            --group watchdog --jobs 3 --timeout "$CASE_TIMEOUT" \
            --simulator "$VOS_BUILD_DIR/c_emulator/sail_riscv_sim" \
            --build-receipt "$VOS_LOG_DIR/model-build.json" \
            --out "$VOS_BUILD_ROOT/boot-chain-target" \
            2>&1 | tee "$VOS_LOG_DIR/boot-chain-target.log"

      - name: Preserve the group receipt and logs
        # always(): a job that reaches its time limit still keeps its progress and logs.
        # The pinned action runs no checked-out code; after a refused dispatch no step
        # has written these paths, so it finds no files and uploads nothing.
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: boot-chain-shard-watchdog-${{ env.CAMPAIGN_REVISION }}
          path: |
            ~/verifiedos-guest/build/boot-chain-target/report.json
            ~/verifiedos-guest/build/boot-chain-target/progress.json
            ~/verifiedos-guest/build/boot-chain-target/*/*.log
            ~/verifiedos-guest/logs/
          if-no-files-found: warn
          overwrite: true
          retention-days: 30

  campaign:
    name: boot-chain-target
    needs: [cold-boot, boot, main-die, watchdog]
    # A shard that failed or was skipped still leaves the join to record or refuse it.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Verify dispatched revision belongs to main
        id: dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: python
        env:
          REQUESTED_REVISION: ${{ inputs.revision || github.sha }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_MAIN_SHA: ${{ github.sha }}
        run: |
          import os
          import re
          import subprocess

          revision = os.environ["REQUESTED_REVISION"]
          if os.environ["DISPATCH_REF"] != "refs/heads/main" or not re.fullmatch(r"[0-9a-f]{40}", revision):
              raise SystemExit("Dispatch must use main and a full lowercase commit SHA")
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if actual != revision:
              raise SystemExit("Checkout does not match the requested revision")
          subprocess.run(["git", "merge-base", "--is-ancestor", revision,
                          os.environ["DISPATCH_MAIN_SHA"]], check=True)

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version-file: tools/pyproject.toml
          enable-cache: true
          save-cache: false
          cache-suffix: guest-gates
          cache-dependency-glob: |
            tools/pyproject.toml
            tools/uv.lock

      - name: Collect the shard receipts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: boot-chain-shard-*-${{ env.CAMPAIGN_REVISION }}
          path: ${{ runner.temp }}/shards

      - name: Join the campaign
        run: |
          shopt -s nullglob
          reports=("$RUNNER_TEMP"/shards/*/build/boot-chain-target/report.json)
          python3 tools/run.py boot-handoff chain-join --out "$RUNNER_TEMP/campaign" "${reports[@]}"

      - name: Report the campaign
        if: ${{ !cancelled() && steps.dispatch.outcome != 'failure' }}
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          report = Path(os.environ["RUNNER_TEMP"]) / "campaign" / "report.json"
          data = json.loads(report.read_text(encoding="utf-8")) if report.is_file() else {"error": "no joined report"}
          lines = [f"### Target chain campaign: {data.get('status', 'failed')}", ""]
          if "error" in data:
              lines.append(f"Refused: {data['error']}")
          else:
              lines += ["| Case | Run kind | Endings | Seconds | Passed |", "| --- | --- | --- | --- | --- |"]
              for row in data["cases"]:
                  endings = ", ".join(f"{run['run']} {run.get('ending', 'not run')}" for run in row["runs"])
                  lines.append(f"| `{row['case']}` | {row['run']} | {endings} | {row['seconds']} | {row['passed']} |")
              if data["unexecuted_cases"]:
                  lines.append(f"\nUnexecuted: {', '.join(data['unexecuted_cases'])}")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")

      - name: Preserve the campaign receipt
        # The pinned action runs no checked-out code; after a refused dispatch the join
        # has not run, so it finds no receipt and uploads nothing.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: boot-chain-campaign-${{ env.CAMPAIGN_REVISION }}
          path: ${{ runner.temp }}/campaign/report.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30
