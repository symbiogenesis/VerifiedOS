# The type checker's settings, held here rather than passed on a command line so
# that an editor's language server (`ty server`) decides exactly what
# `run.py typecheck` (`vos/cli/typecheck.py`) decides. A rule enforced in one and
# not the other is a rule that gets switched off, so there is one file and both
# read it. ty discovers this file from its working directory upward and anchors
# its relative paths at `tools/`, so an editor reads it with `tools/` open as a
# workspace folder; the repository root carries no ty configuration.
#
# `[rules]` sets every rule ty carries to error, including the ones it ships as
# warnings or off by default. That is deliberate and it is what a pinned version
# buys: the alternative is a list of opt-ins that silently stops growing the day
# ty adds a rule nobody transcribed. The gate also passes `--error all`, which
# overrides this table, and it reports these shapes of this file as ty findings: a
# `[rules]` table other than exactly `all = "error"`, because an editor reads the
# table without the flag; an `[[overrides]]` entry carrying any key but `include`
# and `exclude`, because its `rules` can lower the flag's severities and its
# `analysis` can suppress diagnostics for the files it matches; an `[analysis]` key
# outside the ones `vos/cli/typecheck.py` admits as suppressing nothing, which
# refuses `allowed-unresolved-imports` and `replace-imports-with-any`; an
# `[environment]` key other than `python-version`, `python-platform` and
# `extra-paths`, or either of the last two at a value other than the one below,
# because the platform decides which branches ty checks and `python`, `root`,
# `typeshed` or another search path moves where it resolves imports; and a `[src]`
# table other than exactly the one below, because an `include`, a further
# `exclude`, `exclude-scripts` or honoring ignore files takes files out of the run.
# K-75 holds `python-version`. ty also merges a user-level `ty.toml` beneath this
# file, even beside `--config-file`, and the gate reports one that exists.
# `tools/README.md` records the pin.

[rules]
all = "error"

[environment]
python-version = "3.14"

# The tools are one lane but not one platform: `check.py` and its groups run on the
# Windows host, while `vos/env.py`, `vos/cli/model.py` and `vos/cli/proofs.py` run in WSL and use
# `resource.setrlimit` and `os.wait4`, which are POSIX-only and unresolvable when
# the checker assumes the host it happens to be running on. Linux is the platform
# that types every module here, because nothing in this directory is Windows-only.
# ty reports nothing in a branch the platform makes unreachable, so the branches
# the tools take only when `sys.platform` is `win32` go unchecked.
python-platform = "linux"

# `tools/` is the import root: every tool puts its own directory on `sys.path`
# before importing `vos`, so that a tool is runnable from anywhere without the
# package being installed.
extra-paths = ["."]

[src]
exclude = ["**/__pycache__/**"]
# ty otherwise skips whatever a `.gitignore`, `.ignore`, `.git/info/exclude` or
# global gitignore matches, so an ignore pattern matching a tracked module, one in
# a file this tree does not carry included, would take it out of the run.
respect-ignore-files = false

[terminal]
output-format = "concise"
