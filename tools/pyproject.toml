# SPDX-License-Identifier: Apache-2.0
[project]
name = "verifiedos-tools"
version = "0"
requires-python = ">=3.14,<3.15"
dependencies = ["filelock==4.2.9", "jsonschema", "jsonschema-rs==0.60.3", "markdown-it-py==4.2.0", "ruamel.yaml==0.19.1"]

[dependency-groups]
dev = ["ty==0.0.97", "ruff==0.17.3"]
model = ["prek==0.5.10"]
workflows = ["zizmor==1.32.0"]

[tool.uv]
package = false
required-version = "==0.13.6"
python-downloads = "never"
no-build = true
# The release cooldown; tools/README.md gives the policy.
exclude-newer = "3 days"
