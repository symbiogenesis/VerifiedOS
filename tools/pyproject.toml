# SPDX-License-Identifier: Apache-2.0
[project]
name = "verifiedos-tools"
version = "0"
requires-python = ">=3.14,<3.15"
dependencies = ["jsonschema"]

[dependency-groups]
dev = ["ty==0.0.84", "ruff==0.16.9"]
model = ["pre-commit==4.6.2"]
workflows = ["zizmor==1.30.1"]

[tool.uv]
package = false
required-version = "==0.12.19"
python-downloads = "never"
no-build = true
# The release cooldown; tools/README.md gives the policy.
exclude-newer = "3 days"

# Locked releases younger than the cooldown when it was adopted, each capped at the
# first whole second after its last file's upload. tools/README.md says when each goes.
[tool.uv.exclude-newer-package]
filelock = "2026-09-29T23:04:06Z"
platformdirs = "2026-09-29T18:27:57Z"
virtualenv = "2026-09-29T20:25:32Z"
