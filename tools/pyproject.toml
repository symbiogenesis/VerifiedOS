[project]
name = "verifiedos-tools"
version = "0"
requires-python = ">=3.14,<3.15"
dependencies = ["jsonschema"]

[dependency-groups]
dev = ["ty==0.0.89", "ruff==0.17.1"]
model = ["pre-commit==4.7.0"]
workflows = ["zizmor==1.31.1"]

[tool.uv]
package = false
required-version = "==0.13.1"
python-downloads = "never"
no-build = true
# The release cooldown; tools/README.md gives the policy.
exclude-newer = "3 days"
