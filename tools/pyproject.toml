[project]
name = "verifiedos-tools"
version = "0"
requires-python = ">=3.14,<3.15"
dependencies = ["jsonschema"]

[dependency-groups]
dev = ["ty==0.0.84", "ruff==0.16.10"]
model = ["pre-commit==4.6.2"]
workflows = ["zizmor==1.30.1"]

[tool.uv]
package = false
required-version = "==0.12.23"
python-downloads = "never"
no-build = true
# The release cooldown; tools/README.md gives the policy.
exclude-newer = "3 days"
