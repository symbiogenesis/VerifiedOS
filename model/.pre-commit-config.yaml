# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
# This directory is not the Git top level, which pre-commit runs from, so the
# paths below are written from the repository root: `files` keeps every hook
# inside model/, and the exclusion and hook configuration paths name model/.
# Run with `pre-commit run --config model/.pre-commit-config.yaml`.
files: "^model/"
exclude: "^(model/dependencies/)"
minimum_pre_commit_version: 4.6.2
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # Do not strip trailing whitespace from patches or SVG images.
        exclude: '.*\.(diff|patch|svg)'
      - id: end-of-file-fixer
        # Do not strip trailing newlines from patches or SVG images.
        exclude: '.*\.(diff|patch|svg)'
      - id: check-yaml
      - id: check-added-large-files
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: "v23.1.1"
    hooks:
      - id: clang-format
        types_or: [c, c++] # Don't try running clang-format on .json files
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.6
    hooks:
      - id: forbid-tabs
        exclude: '.*\.(diff|dump|patch|svg|S|old)|Makefile*'
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.9
    hooks:
      - id: prettier
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args: [--config, model/.codespellrc]
  - repo: https://github.com/tcort/markdown-link-check
    rev: v3.15.0
    hooks:
      - id: markdown-link-check
        args: [-q, -c model/.markdown-link-check.config]
