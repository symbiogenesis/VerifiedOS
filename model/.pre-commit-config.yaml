# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
# This directory is not the Git top level, which prek runs from, so the
# paths below are written from the repository root: `files` keeps every hook
# inside model/, and the exclusion and hook configuration paths name model/.
# Run with `prek run --config model/.pre-commit-config.yaml`.
# Each remote rev is the full commit of the tag its `# frozen:` comment names:
# a tag can be moved, a commit cannot.
files: "^model/"
exclude: "^(model/dependencies/)"
minimum_pre_commit_version: 4.7.0
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
        # Do not strip trailing whitespace from patches or SVG images.
        exclude: '.*\.(diff|patch|svg)'
      - id: end-of-file-fixer
        # Do not strip trailing newlines from patches or SVG images.
        exclude: '.*\.(diff|patch|svg)'
      - id: check-yaml
      - id: check-added-large-files
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: 411d0309a2a80e90997f6f2596219563e21023a5 # frozen: v23.1.4
    hooks:
      - id: clang-format
        types_or: [c, c++] # Don't try running clang-format on .json files
  - repo: builtin
    hooks:
      - id: deny-pattern
        name: forbid-tabs
        args: ['\t']
        exclude: '.*\.(diff|dump|patch|svg|S|old)|Makefile*'
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: 331f33fa4dfbcbca7c3da3620c137fde0faab273 # frozen: v3.9.10
    hooks:
      - id: prettier
  - repo: https://github.com/crate-ci/typos
    rev: 4c8b7f51ca60df14e3c5ca82770dfbbe6c3dae85 # frozen: v1.52.0
    hooks:
      - id: typos
        args: [--config, model/.typos.toml, --force-exclude]
  - repo: https://github.com/tcort/markdown-link-check
    rev: 275c27c5035a5b4a656fe0e21a4c1403c118c767 # frozen: v3.15.0
    hooks:
      - id: markdown-link-check
        args: [-q, -c model/.markdown-link-check.config]
